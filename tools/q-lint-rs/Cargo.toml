[package]
name = "q-lint-rs"
version = "0.1.0"
edition = "2024"
description = "Native standalone q linter"

[[bin]]
name = "qlinter"
path = "src/main.rs"

[dependencies]
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
glob = "0.3"
walkdir = "2.5"
clap = { version = "4.6", features = ["derive"] }
tempfile = "3.27"
