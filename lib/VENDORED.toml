# Every tree vendored under lib/: where it came from, at which commit, under
# which licence, and what was copied (#2157). One [tree.<dir>] table per
# directory under lib/.
#
#   upstream       the repository it was copied from
#   commit         the upstream commit, in full
#   license        its SPDX id ("NONE" when upstream grants no licence)
#   license_file   the licence text, as named here
#   include        upstream paths copied (absent: the whole repository)
#   omit           upstream paths deliberately not copied (each says why in
#                  `omit_why`)
#   renames        upstream path -> path here
#   local          files here that are this repository's own, not upstream's
#   upstream_tree  upstream's git tree id at `commit`
#   files, digest  how many files lib/.vendored/<dir>.tsv lists, and the
#                  sha256 of that listing
#   drift_digest   the sha256 of lib/.vendored/<dir>.drift.tsv, for a tree
#                  that has one; absent, the tree may hold no drift (#2409)
#
# `commit`, `upstream_tree`, `files` and `digest`, and the listing itself, are
# written by scripts/dev/revendor.py and by nothing else; the gate
# (`python3 scripts/gates/check.py vendored`, a pre-commit hook) recomputes
# every file's git blob id and fails on any byte that is not upstream's.
# Files known to differ from upstream are frozen in
# lib/.vendored/<dir>.drift.tsv - see that file's header.

