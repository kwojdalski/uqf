		.d2-167850648 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="aDA= aspect"><g class="shape" ><rect x="0" y="0" width="209" height="100" rx="6" stroke="transparent" fill="transparent" style="stroke-width:2;" /></g></g><g class="aDE= head"><g class="shape" ><rect x="225" y="0" width="256" height="100" rx="6" stroke="#5a6a78" fill="#eef1f4" style="stroke-width:2;" /></g><text x="353" y="55.5" fill="#25323d" class="text-bold" style="text-anchor:middle;font-size:16px">Plain TorQ</text></g><g class="aDI= head"><g class="shape" ><rect x="497" y="0" width="437" height="100" rx="6" stroke="#5a6a78" fill="#eef1f4" style="stroke-width:2;" /></g><text x="715.5" y="55.5" fill="#25323d" class="text-bold" style="text-anchor:middle;font-size:16px">uqf on TorQ</text></g><g class="YTE= aspect"><g class="shape" ><rect x="0" y="116" width="209" height="98" rx="6" stroke="#c3c9cf" fill="#fbfcfd" style="stroke-width:2;" /></g><text x="104.5" y="170.5" fill="#25323d" class="text-bold" style="text-anchor:middle;font-size:16px">A unit of work</text></g><g class="dDE= torq"><g class="shape" ><rect x="225" y="116" width="256" height="98" rx="6" stroke="#8a7f6a" fill="#f4f1ea" style="stroke-width:2;" /></g><text x="353" y="162.5" fill="#3d3527" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="353" dy="0">a PROCESS: a process.csv row</tspan><tspan x="353" dy="18.5">naming its own q script</tspan></text></g><g class="dTE= uqf"><g class="shape" ><rect x="497" y="116" width="437" height="98" rx="6" stroke="#3d7a5a" fill="#eaf5ef" style="stroke-width:2;" /></g><text x="715.5" y="154.5" fill="#1d4733" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="715.5" dy="0">a JOB: a declaration in src/etl/</tspan><tspan x="715.5" dy="17.666667">(.qetl.job.stream.define · .qetl.job.bounded.define);</tspan><tspan x="715.5" dy="17.666667">one runner script, picked by procname</tspan></text></g><g class="YTI= aspect"><g class="shape" ><rect x="0" y="230" width="209" height="98" rx="6" stroke="#c3c9cf" fill="#fbfcfd" style="stroke-width:2;" /></g><text x="104.5" y="284.5" fill="#25323d" class="text-bold" style="text-anchor:middle;font-size:16px">Configuration</text></g><g class="dDI= torq"><g class="shape" ><rect x="225" y="230" width="256" height="98" rx="6" stroke="#8a7f6a" fill="#f4f1ea" style="stroke-width:2;" /></g><text x="353" y="276.5" fill="#3d3527" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="353" dy="0">edit process.csv and</tspan><tspan x="353" dy="18.5">the config directories</tspan></text></g><g class="dTI= uqf"><g class="shape" ><rect x="497" y="230" width="437" height="98" rx="6" stroke="#3d7a5a" fill="#eaf5ef" style="stroke-width:2;" /></g><text x="715.5" y="268.5" fill="#1d4733" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="715.5" dy="0">lib/torq never edited: process.csv and</tspan><tspan x="715.5" dy="17.666667">database.q regenerated on every command</tspan><tspan x="715.5" dy="17.666667">from the job declarations + plant_tables.q</tspan></text></g><g class="YTM= aspect"><g class="shape" ><rect x="0" y="344" width="209" height="98" rx="6" stroke="#c3c9cf" fill="#fbfcfd" style="stroke-width:2;" /></g><text x="104.5" y="398.5" fill="#25323d" class="text-bold" style="text-anchor:middle;font-size:16px">Who knows TorQ exists</text></g><g class="dDM= torq"><g class="shape" ><rect x="225" y="344" width="256" height="98" rx="6" stroke="#8a7f6a" fill="#f4f1ea" style="stroke-width:2;" /></g><text x="353" y="382.5" fill="#3d3527" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="353" dy="0">every process: code is</tspan><tspan x="353" dy="17.666667">written against .servers,</tspan><tspan x="353" dy="17.666667">.u.upd, .lg directly</tspan></text></g><g class="dTM= uqf"><g class="shape" ><rect x="497" y="344" width="437" height="98" rx="6" stroke="#3d7a5a" fill="#eaf5ef" style="stroke-width:2;" /></g><text x="715.5" y="382.5" fill="#1d4733" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="715.5" dy="0">only .qtorq, in scripts/ - a gate fails the</tspan><tspan x="715.5" dy="17.666667">build otherwise. The same jobs run on</tspan><tspan x="715.5" dy="17.666667">stock kdb+ via run_stream.q and .qetl.tick</tspan></text></g><g class="YTQ= aspect"><g class="shape" ><rect x="0" y="458" width="209" height="98" rx="6" stroke="#c3c9cf" fill="#fbfcfd" style="stroke-width:2;" /></g><text x="104.5" y="512.5" fill="#25323d" class="text-bold" style="text-anchor:middle;font-size:16px">History and backfills</text></g><g class="dDQ= torq"><g class="shape" ><rect x="225" y="458" width="256" height="98" rx="6" stroke="#8a7f6a" fill="#f4f1ea" style="stroke-width:2;" /></g><text x="353" y="504.5" fill="#3d3527" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="353" dy="0">replay a tickerplant log,</tspan><tspan x="353" dy="18.5">or write your own loader</tspan></text></g><g class="dTQ= uqf"><g class="shape" ><rect x="497" y="458" width="437" height="98" rx="6" stroke="#3d7a5a" fill="#eaf5ef" style="stroke-width:2;" /></g><text x="715.5" y="496.5" fill="#1d4733" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="715.5" dy="0">bounded workers (.qetl.job.bounded): a window range,</tspan><tspan x="715.5" dy="17.666667">written through .qetl.io - never the plant -</tspan><tspan x="715.5" dy="17.666667">and recorded in a coverage ledger (.qetl.coverage)</tspan></text></g><g class="YTU= aspect"><g class="shape" ><rect x="0" y="572" width="209" height="98" rx="6" stroke="#c3c9cf" fill="#fbfcfd" style="stroke-width:2;" /></g><text x="104.5" y="626.5" fill="#25323d" class="text-bold" style="text-anchor:middle;font-size:16px">A table on the plant</text></g><g class="dDU= torq"><g class="shape" ><rect x="225" y="572" width="256" height="98" rx="6" stroke="#8a7f6a" fill="#f4f1ea" style="stroke-width:2;" /></g><text x="353" y="610.5" fill="#3d3527" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="353" dy="0">define it in database.q;</tspan><tspan x="353" dy="17.666667">.u.upd onto an undefined</tspan><tspan x="353" dy="17.666667">one drops rows silently</tspan></text></g><g class="dTU= uqf"><g class="shape" ><rect x="497" y="572" width="437" height="98" rx="6" stroke="#3d7a5a" fill="#eaf5ef" style="stroke-width:2;" /></g><text x="715.5" y="610.5" fill="#1d4733" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="715.5" dy="0">defined from what jobs declare they</tspan><tspan x="715.5" dy="17.666667">publish; a job refuses to start when a</tspan><tspan x="715.5" dy="17.666667">table it publishes is missing</tspan></text></g><g class="YTY= aspect"><g class="shape" ><rect x="0" y="686" width="209" height="98" rx="6" stroke="#c3c9cf" fill="#fbfcfd" style="stroke-width:2;" /></g><text x="104.5" y="740.5" fill="#25323d" class="text-bold" style="text-anchor:middle;font-size:16px">Adding one</text></g><g class="dDY= torq"><g class="shape" ><rect x="225" y="686" width="256" height="98" rx="6" stroke="#8a7f6a" fill="#f4f1ea" style="stroke-width:2;" /></g><text x="353" y="732.5" fill="#3d3527" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="353" dy="0">write the script, add the</tspan><tspan x="353" dy="18.5">row, pick a free port</tspan></text></g><g class="dTY= uqf"><g class="shape" ><rect x="497" y="686" width="437" height="98" rx="6" stroke="#3d7a5a" fill="#eaf5ef" style="stroke-width:2;" /></g><text x="715.5" y="724.5" fill="#1d4733" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="715.5" dy="0">uqs job new scaffolds it, or uqs job install</tspan><tspan x="715.5" dy="17.666667">brings it in; no registration step -</tspan><tspan x="715.5" dy="17.666667">port, process table and DAG are derived</tspan></text></g><g class="YTc= aspect"><g class="shape" ><rect x="0" y="800" width="209" height="114" rx="6" stroke="#c3c9cf" fill="#fbfcfd" style="stroke-width:2;" /></g><text x="104.5" y="862.5" fill="#25323d" class="text-bold" style="text-anchor:middle;font-size:16px">Operating it</text></g><g class="dDc= torq"><g class="shape" ><rect x="225" y="800" width="256" height="114" rx="6" stroke="#8a7f6a" fill="#f4f1ea" style="stroke-width:2;" /></g><text x="353" y="854.5" fill="#3d3527" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="353" dy="0">torq.sh start · stop ·</tspan><tspan x="353" dy="18.5">summary, per process</tspan></text></g><g class="dTc= uqf"><g class="shape" ><rect x="497" y="800" width="437" height="114" rx="6" stroke="#3d7a5a" fill="#eaf5ef" style="stroke-width:2;" /></g><text x="715.5" y="838.5" fill="#1d4733" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="715.5" dy="0">uqs: profiles held to the licence&#39;s</tspan><tspan x="715.5" dy="17.25">connection budget, up (streams logs),</tspan><tspan x="715.5" dy="17.25">logs · conn · summary; .qetl.log adds DEBUG,</tspan><tspan x="715.5" dy="17.25">TRACE and key=value fields on top of .lg</tspan></text></g><mask id="d2-167850648" maskUnits="userSpaceOnUse" x="-41" y="-41" width="1016" height="996">
<rect x="-41" y="-41" width="1016" height="996" fill="white"></rect>

</mask></svg></svg>
