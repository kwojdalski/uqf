# qlinter's configuration for the releases that read this file (0.14+), and
# what a bare `qlinter` here runs with. CI pins v0.2.0, which reads only
# pyproject.toml's [tool.q-lint] and accepts nothing there but `exclude` - so
# the exclude list lives in both, held equal by test_check_q_traps.py, and
# what only a newer release understands lives here alone.
exclude = ["lib/torq/", ".claude/worktrees/"]

# Rules this tree does not apply. QS010 (mixed-naming-convention) flags a
# file that mixes naming styles - but this tree's q is snake_case beside
# TorQ's and q's own camelCase (.proc.procname, .u.upd, .z.ts), so nearly
# every file touching either is flagged for a choice it did not make.
ignore = ["QS010"]
