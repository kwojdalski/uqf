# Pre-commit configuration for uqf (q/kdb+ quant library).
# Local hooks are scoped for q/qUnit since the library itself is pure q.
# The Python packages under python/ get ruff and pytest hooks over every .py
# file outside lib/.
#
# A hook that needs a q, which hosted CI has none of, carries `# kdbx-only` on
# the line under its `- id:` (#2170). That tag is the one place the set is
# written: kdbx_attestation.HOOKS and ci.yml's no-q SKIP list read it
# (scripts/gates/check.py hook-scopes --kdbx-only).
repos:
  # Basic file hygiene
  #
  # The hooks that rewrite a file, or parse it as strict YAML/TOML/JSON,
  # exclude lib/ for the reason panache does below: vendored trees are
  # copied byte-for-byte from upstream and never edited here, and upstream's
  # own conventions (trailing spaces, CRLF, JSON with comments) are not ours
  # to fix. The size, case and merge-conflict checks still cover lib/.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '(\.md$|^lib/)'  # Allow trailing spaces in markdown for line breaks
      - id: end-of-file-fixer
        exclude: '^lib/'
      - id: check-yaml
        exclude: '^lib/'
      - id: check-toml
        exclude: '^lib/'
      - id: check-json
        exclude: '^lib/'
      - id: check-added-large-files
        args: ['--maxkb=10240']  # 10MB limit for data files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: '^lib/'

  # Markdown and Quarto formatting/linting
  #
  # panache understands Quarto and Pandoc syntax that generic markdown
  # formatters mangle - fenced divs, attribute blocks, tables. It is the
  # reason this is not prettier or mdformat: docs/presentation/uqf.qmd
  # nests `::: {.column}` inside `::: {.columns}`, and only a formatter
  # that parses Pandoc gets the colon counts right.
  #
  # Three exclusions, and each would break something specific:
  #   lib/          vendored TorQ and the starter pack, which are never
  #                 edited - an edit survives until the next upgrade and is
  #                 then silently lost.
  #   processes.md  generated by `scripts/generate/derive.py operational-docs`,
  #                 which CI runs with --check. Formatting it here would make
  #                 the two gates fight: panache rewrites it, the generator
  #                 says it no longer matches the registry, forever.
  #   web/          prettier already owns it - `npm run check` runs
  #                 `prettier --check .` over the package, web/README.md
  #                 included, and the CI job for it goes red the moment a
  #                 second formatter touches that file. One owner per file.
  #
  # Style lives in .panache.toml so a manual `panache format` matches the
  # hook. `scripts/gates/check.py hook-scopes` fails a scope that matches
  # nothing, so both paths above have to stay real.
  - repo: https://github.com/jolars/panache-pre-commit
    rev: v3.12.0
    hooks:
      - id: panache-format
        exclude: '^(lib/|web/|docs/reference/processes\.md$)'
      - id: panache-lint
        exclude: '^(lib/|web/|docs/reference/processes\.md$)'

  # Python linting/formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      # Scoped by INTENT - every .py file except vendored - rather than by
      # directory. A directory list goes stale silently: this was scoped
      # '^python/uqf-client/' while Python was being added under
      # uqs/ and uqf_frontend/, so 43 of 47 tracked .py files
      # were never linted, and nothing complained because the scope was
      # still valid, merely too narrow. Matching all Python and excluding
      # lib/ cannot drift that way. `scripts/gates/check.py hook-scopes` enforces it.
      - id: ruff
        name: ruff (all python)
        args: ['--fix']
        files: '\.py$'
        exclude: '^lib/'
      - id: ruff-format
        name: ruff-format (all python)
        files: '\.py$'
        exclude: '^lib/'

  - repo: local
    hooks:
      # The Python tests the push reaches, from the uv workspace root - never
      # the whole suite by default: CI runs that on every pull request that can
      # reach a Python test, on a clean Linux checkout (#1879, #1955). At
      # `git push`, not at commit (#1965): under load it made a commit take
      # minutes. It reads the pushed range pre-commit names, where at commit it
      # read what was staged.
      #
      # scripts/dev/python_tests_hook.py picks them from two records: testmon's
      # (the Python each test executes) for a staged .py file, and
      # scripts/dev/test_reach.py's (what each test reads, lists and starts:
      # a q, a gate run as a script) for anything else - a .q runs every test
      # that starts a q. The whole suite only when it cannot decide: no record
      # yet, a conftest, pyproject or uv.lock, nothing staged - or
      # UQF_HOOKS_FULL=1, the switch back to every hook in full
      # (scripts/dev/hooks_full.py).
      #
      # Scoped to every file for that reason: a change anywhere can fail a
      # Python test. Some suites start a real q process (uqf_frontend's kola
      # IPC tests, uqs's example-script runs) and skip if they find no
      # interpreter. They find it by $QCMD, else q on PATH - TorQ's rule
      # (uqs.paths.q_interpreter).
      - id: python-tests
        name: Run the Python tests the push reaches (all with UQF_HOOKS_FULL=1)
        entry: uv run python scripts/dev/python_tests_hook.py
        language: system
        files: '.'
        pass_filenames: false
        stages: [pre-push]

      - id: check-hook-scopes
        name: Check pre-commit hook scopes cover the code
        entry: uv run python scripts/gates/check.py hook-scopes
        language: system
        pass_filenames: false
        always_run: true

      # Static checks for q traps that produce a WRONG ANSWER rather than an
      # error - a lone `/` silently commenting out a whole file, a builtin
      # used as a parameter name, a `where col=col` that matches every row.
      # The q test suite cannot catch these: several of them made a file load
      # "successfully" or a check report a failure that never happened.
      # always_run because the rules scan every tracked .q file, not only the
      # staged ones - a rule added today should flag a file touched last
      # month.
      # The TYPE gate. Scoped like the lint and test gates - all Python,
      # vendored excluded - and enforced by `check.py hook-scopes` so it
      # cannot narrow silently the way the lint hook once did.
      #
      # pass_filenames is false because ty type-checks a PROJECT, not a file
      # list: a change in one module can only be judged against the modules
      # that import it. Passing just the staged files would check each in
      # isolation and miss exactly the cross-module breakage a type checker
      # is for.
      - id: ty
        name: ty (all python)
        entry: uv run ty check
        language: system
        files: '\.py$'
        exclude: '^lib/'
        pass_filenames: false

      - id: q-traps
        name: Check q files for silent-failure traps
        entry: uv run python scripts/gates/check.py q-traps
        language: system
        pass_filenames: false
        always_run: true

      # No `\d` may name more than one level (#1411): PeachQ cannot load one.
      # always_run because the rule scans src/, scripts/, sidecars/ and docs/,
      # not only what is staged - one list, in the gate itself.
      - id: nested-contexts
        name: Refuse a \d context more than one level deep
        entry: uv run python scripts/gates/check.py nested-contexts
        language: system
        pass_filenames: false
        always_run: true

      # A tool version written in several files - uv, pre-commit, Quarto,
      # Python, ruff, Node - is held equal across them (#1838): a bump that
      # missed one copy left CI, install.sh and kdbx_attestation.py running
      # different tools. always_run because the copies are listed once, in
      # scripts/gates/policy/tool_pins.py; a `files:` scope here would be a
      # second list of them, free to drift from the first.
      - id: tool-pins
        name: Hold every copy of a tool version pin equal
        entry: uv run python scripts/gates/check.py tool-pins
        language: system
        pass_filenames: false
        always_run: true

      # Every tree under lib/ is byte-identical to the upstream commit
      # lib/VENDORED.toml records (#2157): each file's git blob id is
      # recomputed and compared with lib/.vendored/<tree>.tsv. The hooks
      # above exclude lib/ so they never rewrite it; this refuses anyone
      # else's edit. A tree changes only through scripts/dev/revendor.py.
      - id: vendored
        name: Hold every vendored tree under lib/ to its recorded upstream
        entry: uv run python scripts/gates/check.py vendored
        language: system
        pass_filenames: false
        files: '^lib/|^scripts/gates/(check|policy/vendored)\.py$'

      - id: bundle-blocks
        name: Refuse an installed bundle's blocks in tracked q files
        entry: uv run python scripts/gates/check.py bundle-blocks
        language: system
        pass_filenames: false
        always_run: true

      # Static gates that ran in CI alone (#1879): each needs only the tree
      # and the standard library, so a commit runs them where it is made, and
      # CI's clean-clone `pre-commit run --all-files` runs them again over
      # everything. Each is scoped to what it reads.
      - id: etl-layering
        name: Check the ETL core does not depend on its declarations
        entry: uv run python scripts/gates/check.py etl-layering
        language: system
        pass_filenames: false
        files: '\.q$|^scripts/gates/(check|policy/etl_layering)\.py$'

      - id: module-deps
        name: Check the q library's module graph is acyclic and reviewed
        entry: uv run python scripts/gates/check.py module-deps
        language: system
        pass_filenames: false
        files: '\.q$|^scripts/gates/(check|qlint_graph|policy/module_deps)\.py$'

      - id: q-module-size
        name: Check q modules stay under their line budget
        entry: uv run python scripts/gates/check.py q-module-size
        language: system
        pass_filenames: false
        files: '\.q$|^scripts/gates/(check|policy/q_module_size)\.py$'

      - id: markout-mapped
        name: Check a markout's path selects market_data by its date alone and reads no depth
        entry: uv run python scripts/gates/check.py markout-mapped
        language: system
        pass_filenames: false
        files: '^src/etl/.*\.q$|^scripts/gates/(check|policy/markout_mapped)\.py$'

      - id: variant-gather
        name: Check the reference-variant gather reads the deduped rids once and nothing else
        entry: uv run python scripts/gates/check.py variant-gather
        language: system
        pass_filenames: false
        files: '^src/etl/.*\.q$|^scripts/gates/(check|policy/variant_gather)\.py$'

      - id: registry-enlist
        name: Check every q registry stores its values enlisted
        entry: uv run python scripts/gates/check.py registry-enlist
        language: system
        pass_filenames: false
        files: '\.q$|^scripts/gates/(check|policy/registry_enlist)\.py$'

      # Reads every file under src/, scripts/, sidecars/, web/, python/,
      # lib/ and tests/ for a variable read or produced, and the page itself.
      - id: env-reference
        name: Check the environment reference lists every variable
        entry: uv run python scripts/gates/check.py env-reference
        language: system
        pass_filenames: false
        files: '^(src|scripts|sidecars|web|python|lib|tests)/|^docs/reference/environment(\.md|/[a-z]+\.csv)$'

      - id: declaration-reference
        name: Check the pipeline declaration reference lists every key
        entry: uv run python scripts/gates/check.py declaration-reference
        language: system
        pass_filenames: false
        files: '\.q$|^docs/reference/pipeline-declarations\.md$|^scripts/gates/(check|policy/declaration_reference)\.py$'

      - id: doc-references
        name: Check the docs cite functions that exist
        entry: uv run python scripts/gates/check.py doc-references
        language: system
        pass_filenames: false
        always_run: true

      # The two generated artifacts that are pure functions of tracked
      # source, REGENERATED here rather than checked.
      #
      # Both ran in CI only, with `--check`, so forgetting to regenerate cost
      # a full round trip: commit, push, watch CI go red, run a command that
      # takes a fifth of a second, commit again. The new-job skill has a
      # step telling you to remember; a tool that remembers is better than a
      # document that reminds.
      #
      # Modify-and-fail, the contract ruff-format already uses in this file:
      # the hook rewrites the file and fails the commit, so you `git add` and
      # commit again with the regenerated artifact in the same change.
      #
      # NOT the third one. contract_surface needs KDB-X to load the whole q
      # tree, so it is CHECKED rather than regenerated, and lives with the
      # other interpreter-bound hooks below.
      #
      # NOT rendered-diagrams either, and that stays `--check` below for the
      # reason its own header gives: d2 lays out differently between
      # releases, so regenerating would start a churn war between two
      # developers on different versions. These two have no such skew.
      - id: operational-docs
        name: Regenerate the process table and pipeline DAG from the registry
        entry: uv run python scripts/generate/derive.py operational-docs
        language: system
        pass_filenames: false
        files: ^(src/etl/|scripts/processes/|python/uqs/src/uqs/model/)

      - id: rendered-diagrams
        name: Check the rendered diagrams match their d2 sources
        entry: uv run python scripts/generate/derive.py diagrams --check
        language: system
        pass_filenames: false
        files: ^docs/diagrams/
        always_run: false

      - id: diagram-ports
        name: Check the diagram port labels match the stack (#1369)
        entry: uv run python scripts/gates/check.py diagram-ports
        language: system
        pass_filenames: false
        files: ^(docs/diagrams/.*\.d2|scripts/processes/|scripts/torqconfig/|python/uqs/src/uqs/(model|stack)/|scripts/gates/(check|policy/diagram_ports)\.py$)

      # At `git push`, not at commit (#1965), with q-coverage and
      # python-tests: the three that run test suites made a commit take 10-30
      # minutes under load. kdbx_attestation.py attest runs them by id, at their stage.
      - id: q-tests
        # kdbx-only
        name: Run qUnit tests for uqf
        entry: bash
        language: system
        stages: [pre-push]
        args:
          - -c
          - |
            set -euo pipefail
            # Through pytest (#1808), whose `kdbx` fixture finds q the README's
            # way: $QCMD if you set it, otherwise q on PATH, as TorQ does, and
            # asks it which q it is. This hook once found q itself - PATH, then
            # ~/.kx/bin/q, then PeachQ at ./q - the only lookup in this repo
            # that fell back to something the tree is not verified on.
            # --require-q kdbx: without KDB-X every test here would skip, and
            # the hook would pass having run nothing.
            #
            # Only the suites the change reaches (#1690): test_impact.py reads
            # q-lint's dependency graph and selects for origin/master...HEAD
            # plus what is being committed - the branch's whole change, as the
            # KDB-X attestation check reads the PR, not just this commit. It
            # prints ALL - and the whole suite runs - when it says so, when it
            # cannot run (no graph-capable qlinter; see .qlinter-version),
            # or when UQF_Q_TESTS_FULL=1 or UQF_HOOKS_FULL=1. kdbx_attestation.py attest hands its own
            # decision over in UQF_Q_TESTS_SELECTION, so the run is the one
            # its trailer records. The selection reaches tests/run_tests.q as
            # --q-files. The full suite still runs on master.
            #
            # In an attestation the suite runs ONCE (#1704): kdbx_attestation.py attest
            # runs q-coverage first, which executes every test, reads the
            # outcomes it records, and fails q-tests itself on any test that
            # did not pass. It then sets UQF_Q_UNIT_FROM_COVERAGE=1 and only
            # the rest of this hook runs. A commit never sets it.
            #
            # The rest: every documented @eg (tests/q/run_examples.q) and the
            # worked examples under scripts/examples/, each run as a script.
            # The python-tests hook leaves all of these out
            # (-m "not q_backend"), so a commit runs each once, here. Nothing
            # ran the worked examples until the q-scripts lane existed, and
            # the first scenario added there found a false claim in
            # plant_tables.q about `quotes` being usable by cross_book_at
            # unreshaped.
            suite=()
            if [ "${UQF_Q_UNIT_FROM_COVERAGE:-}" = 1 ]; then
              echo "== q-unit: verdict taken from the q-coverage run (kdbx_attestation.py attest) =="
            else
              selection=$(uv run python scripts/dev/test_impact.py --hook)
              case "$selection" in
                ALL) suite=(tests/qrun/test_q_suite.py::test_the_q_suite_passes) ;;
                NONE) echo "== q-unit: no suite reaches this change - none run ==" ;;
                -files\ *) suite=(tests/qrun/test_q_suite.py::test_the_q_suite_passes --q-files "${selection#-files }") ;;
                *) echo "q-tests: unexpected selection: $selection" >&2; exit 1 ;;
              esac
            fi
            uv run pytest -q -n auto --dist loadgroup --require-q kdbx ${suite[@]+"${suite[@]}"} tests/qrun/test_documented_examples.py tests/qrun/test_worked_examples.py
        files: '\.q$|^tests/qrun/(qrun_support|test_q_suite|test_documented_examples|test_worked_examples)\.py$'
        pass_filenames: false

      # The ```q blocks in docs/ marked `<!-- q-example: ... -->`; CI runs the
      # same lane on PeachQ (q-docs-peachq below), so here is where KDB-X
      # checks them. Its own hook, not a line of q-tests, so a docs edit asks
      # only for this lane - and only a doc that HAS a marked block: the scope
      # names those documents, and `scripts/gates/check.py hook-scopes` fails
      # when it names one more or one fewer than scripts/dev/doc_examples.py
      # finds. Every other .md cannot change what q-docs runs, so it needs no
      # KDB-X attestation (scripts/dev/kdbx_attestation.py).
      - id: q-docs
        # kdbx-only
        name: Run the q blocks in docs/ on KDB-X
        # tests/qrun/test_doc_blocks.py, a test per document; -m kdbx picks
        # the KDB-X half, and --require-q kdbx fails a run without KDB-X
        # rather than letting every test skip (#1808).
        entry: uv run pytest -q -n auto --dist loadgroup -m kdbx --require-q kdbx tests/qrun/test_doc_blocks.py
        language: system
        files: '\.q$|^scripts/dev/doc_examples\.py$|^tests/qrun/(qrun_support|test_doc_blocks)\.py$|^docs/(architecture/event-tape|guides/config-audit|guides/new-pipeline|reference/quant-modules|services/cross-arbitrage)\.md$'
        pass_filenames: false

      # The same doc blocks again, on PeachQ. Both interpreters are REQUIRED
      # for now: until the two are compatible enough for one to stand for
      # both, neither run vouches for the other. The PeachQ half runs in CI, on
      # every pull request (the PeachQ Python shards run tests/qrun/), so at
      # commit it runs only in full mode, UQF_HOOKS_FULL=1 (#1879). PeachQ is
      # $QCMD when it is PeachQ, else the pinned build from
      # scripts/peachq/pin.json, built into ~/.cache/uqf/peachq on first use; when
      # neither can be had this fails, rather than skipping.
      - id: q-docs-peachq
        name: Run the q blocks in docs/ on PeachQ too (UQF_HOOKS_FULL=1; CI runs it)
        entry: uv run python scripts/dev/hooks_full.py --hook q-docs-peachq -- uv run pytest -q -n auto --dist loadgroup -m peachq --require-q peachq tests/qrun/test_doc_blocks.py
        language: system
        files: '\.q$|^scripts/dev/doc_examples\.py$|^tests/qrun/(qrun_support|test_doc_blocks)\.py$|^docs/(architecture/event-tape|guides/config-audit|guides/new-pipeline|reference/quant-modules|services/cross-arbitrage)\.md$'
        pass_filenames: false

      - id: doc-links
        name: Check every link and anchor in docs/ resolves (UQF_HOOKS_FULL=1; CI runs it)
        # Asks Quarto to resolve each link the way a reader's browser will,
        # then checks the #fragment Quarto ignores. Nothing else covered
        # either: `check.py doc-references` holds the prose to the q FUNCTIONS
        # it names, and a path that appears in no generated artifact had
        # nothing to disagree with.
        #
        # Only in full mode, UQF_HOOKS_FULL=1 (#1879): the render takes minutes
        # (it writes the q API pages first), and CI's "Docs links" job runs it
        # on every pull request that touches what it renders - strictly, with
        # no flag. Here --allow-missing, unlike the contract-surface hook
        # below: a hosted runner cannot have KDB-X but installing Quarto is
        # one step, so CI is the environment that CAN enforce. A q developer
        # without Quarto gets a warning here rather than a block.
        entry: uv run python scripts/dev/hooks_full.py --hook doc-links -- uv run python scripts/gates/check_doc_links.py --allow-missing
        language: system
        pass_filenames: false
        files: '^docs/.*\.(md|qmd)$|^docs/_quarto\.yml$|^docs/man\.q$|^scripts/gates/check_doc_links\.py$|^scripts/generate/(q_api_docs\.py|export_q_api_docs\.q)$'
      - id: contract-surface
        # kdbx-only
        name: Check the committed contract surface matches the tree
        # docs/reference/surfaces/current/ used to be checked in CI alone,
        # and hosted CI has no KDB-X, so that check skipped on every run:
        # nothing verified the surface at all. Here it runs wherever the
        # q tests run, and like them it FAILS without an interpreter rather
        # than skipping - CI opts out explicitly, through SKIP, with a
        # warning. `check`, not `export`: the check compares contracts, so an
        # interpreter upgrade that changes nothing public changes nothing.
        # To accept an intended change:
        #   uv run python scripts/generate/derive.py contract-surface
        entry: uv run python scripts/generate/derive.py contract-surface --check
        language: system
        pass_filenames: false
        # q for functions and tables, the Python registry for processes, the
        # env scan over both for variables - and the committed surface the
        # check compares them with, so a hand edit to it is checked too.
        files: '\.(q|py)$|^scripts/processes/|^docs/reference/surfaces/'

      - id: q-facts
        # kdbx-only
        name: Check the generated q facts match the q tree
        # uqs runs without q, so the q values it needs (conflict strategies,
        # run modes, log levels, ledger columns, the status file's states and
        # name) are generated into python/uqs/src/uqs/generated/q_facts.py
        # from the loaded tree - not hand-copied and regex-pinned one by one
        # (#818). The status facts also go to the Airflow provider's
        # q_facts.py, which cannot import uqs (#1362). KDB-X only, like the
        # contract surface: it FAILS without an interpreter rather than
        # skipping. To accept an intended change:
        #   uv run python scripts/generate/derive.py q-facts
        entry: uv run python scripts/generate/derive.py q-facts --check
        language: system
        pass_filenames: false
        files: '\.q$|^python/uqs/src/uqs/generated/|^python/uqf_airflow_provider/src/uqf_airflow_provider/q_facts\.py$|^scripts/generate/(derive\.py|q_facts\.py|export_q_facts\.q)$'

      - id: plant-schema
        # kdbx-only
        name: Check the plant schema metadata matches what q evaluates
        # uqs reads the plant tables' columns, types, attributes, nested element
        # types and sort rules from src/etl/generated/plant_schema.json, which
        # q exports from plant_tables.q - never by matching the q text, which
        # lost `name: ([]...)` (#1781). Every read checks the file's fingerprint
        # without q; this checks its CONTENT against q. KDB-X or PeachQ: the
        # exporter loads plant_tables.q and plant_registry.q alone. FAILS without an interpreter.
        # To accept an intended change:
        #   uv run python scripts/generate/derive.py plant-schema
        entry: uv run python scripts/generate/derive.py plant-schema --check
        language: system
        pass_filenames: false
        files: '^src/etl/plant_(tables|registry)\.q$|^src/etl/generated/plant_schema\.json$|^scripts/generate/(derive\.py|export_plant_schema\.q)$|^python/uqs/src/uqs/model/plant_metadata(_gen)?\.py$'

      - id: table-properties
        name: Check the getdata table list matches the plant tables and workers' datasets
        # scripts/torqconfig/dataaccess/tableproperties.csv is generated (#1363):
        # a row for every plant table and every bounded worker's dataset, so
        # nothing the catalog offers is refused by TorQ's checktablename. It
        # needs no q - the workers' datasets are in the committed q_facts.py.
        # To accept an intended change:
        #   uv run python scripts/generate/derive.py table-properties
        entry: uv run python scripts/generate/derive.py table-properties --check
        language: system
        pass_filenames: false
        files: '^src/etl/plant_tables\.q$|^scripts/torqconfig/dataaccess/tableproperties\.csv$|^python/uqs/src/uqs/(generated/q_facts|stack/gateway_access)\.py$|^scripts/generate/derive\.py$'

      - id: housekeeping-config
        name: Check the committed housekeeping rules match stack/housekeeping.py
        # scripts/torqconfig/housekeeping.csv and housekeeping_schedule.csv are
        # what bootstrap writes into TORQDATA for housekeeping1 (#2150),
        # committed so a change to its rules is reviewed as the files it reads.
        # To accept an intended change:
        #   uv run python scripts/generate/derive.py housekeeping-config
        entry: uv run python scripts/generate/derive.py housekeeping-config --check
        language: system
        pass_filenames: false
        files: '^python/uqs/src/uqs/stack/housekeeping\.py$|^scripts/torqconfig/housekeeping(_schedule)?\.csv$|^scripts/generate/(derive|housekeeping_config)\.py$'

      - id: environment-tables
        name: Check the environment reference's tables match their declarations
        # The two variable tables in docs/reference/environment.md are
        # generated (#2169) from docs/reference/environment/*.csv, which the
        # env-reference gate also reads. Needs no q. To accept an intended change:
        #   uv run python scripts/generate/derive.py environment-tables
        entry: uv run python scripts/generate/derive.py environment-tables --check
        language: system
        pass_filenames: false
        files: '^docs/reference/environment(\.md|/[a-z]+\.csv)$|^scripts/generate/(derive|environment_tables)\.py$|^scripts/gates/policy/env_reference\.py$'

      - id: compression-config
        # kdbx-only
        name: Check TorQ's compressionconfig.csv matches the declared compression policy
        # scripts/torqconfig/compressionconfig.csv is generated (#2152) from
        # src/etl/compression_policy.q, validated by core/compression.q: a
        # hand-written CSV would be a second copy of facts that belong to the
        # datasets. KDB-X only, like q-facts: it FAILS without an interpreter.
        # To accept an intended change:
        #   uv run python scripts/generate/derive.py compression-config
        entry: uv run python scripts/generate/derive.py compression-config --check
        language: system
        pass_filenames: false
        files: '^src/etl/(compression_policy\.q|core/compression\.q|plant_(tables|registry)\.q)$|^scripts/torqconfig/compressionconfig\.csv$|^scripts/generate/(derive\.py|compression_config\.py|export_compression_config\.q)$'

      - id: q-coverage
        # kdbx-only
        name: Check every function a test should reach is reached
        entry: bash
        language: system
        stages: [pre-push]
        args:
          - -c
          - |
            set -euo pipefail
            # Runs the suite again at commit, under .cov's in-memory
            # instrumentation (in an attestation, the only time:
            # kdbx_attestation.py attest takes q-tests' q-unit verdict from this run's
            # outcomes, #1704), and fails when the set of functions nothing
            # enters differs from tests/q/coverage_baseline.txt - in either
            # direction. A new blind spot is a failure; so is a baseline
            # entry whose gap has been closed, because a list that only grows
            # stops describing anything.
            #
            # Only what the change reaches (#1719): q-tests' suites, plus a
            # suite that enters each judged function per
            # tests/q/coverage_map.txt, judging the functions of the
            # production files the change reaches, as
            # scripts/dev/test_impact.py --coverage-hook says (kdbx_attestation.py attest
            # hands its own decision over in UQF_Q_COVERAGE_SELECTION). ALL
            # is the whole suite judging every function, as before. A subset
            # that finds a function never entered hands its verdict to a
            # whole run; the rest of the tree is judged by the whole run on
            # master (scripts/dev/master_coverage.py).
            #
            # Through pytest (tests/qrun/test_q_coverage.py, #1808) for the
            # same reason the hook above is: one rule for which interpreter
            # ($QCMD, else q on PATH), never a fallback to something the tree
            # is not verified on; --require-q kdbx fails a run without KDB-X.
            #
            # It roughly doubled the time a q commit took, and under load a
            # commit took 10-30 minutes, so it runs at `git push` (#1965)
            # rather than being dropped: the check is cheap compared to
            # noticing months later that nothing calls a function.
            selection=$(uv run python scripts/dev/test_impact.py --coverage-hook)
            case "$selection" in
              ALL) subset=() ;;
              # -files a.q,b.q -modules src/x.q,...: no spaces in either list
              -files\ *\ -modules\ *) read -ra words <<< "$selection"; subset=(--q-files "${words[1]}" --q-modules "${words[3]}") ;;
              *) echo "q-coverage: unexpected selection: $selection" >&2; exit 1 ;;
            esac
            uv run pytest -q -m coverage --require-q kdbx tests/qrun/test_q_coverage.py ${subset[@]+"${subset[@]}"}
        # The baseline too: an edit to it alone changes what this judges; and
        # the pytest module and the decision it makes (#1808).
        files: '\.q$|^tests/q/coverage_baseline\.txt$|^tests/qrun/(qrun_support|q_coverage|test_q_coverage)\.py$'
        pass_filenames: false

      # The q test files the branch adds or changes, on PeachQ, before the
      # push (#1965). CI's "PeachQ q tests" job runs the whole suite on PeachQ
      # and is where that check lives (#1879); this is only the early catch for
      # its commonest failure - a new test KDB-X passes and PeachQ does not,
      # which bounced five pull requests on 2026-11-03 for an hour each and
      # reproduced locally in a minute. An added or removed @eg line also
      # runs tests/q/test_docstring_examples.q (#1978). Failures listed in
      # tests/q/peachq_known_gaps.txt are expected. PeachQ is found as
      # q-docs-peachq finds it: $QCMD when it is PeachQ, else the pinned build.
      # Push without it: SKIP=peachq-push git push.
      - id: peachq-push
        name: Run the q test files this branch changes on PeachQ (CI runs them all)
        entry: uv run python scripts/peachq/pre_push.py
        language: system
        files: '\.q$'
        pass_filenames: false
        stages: [pre-push]

      # After a merge or rebase that kept one side of a generated file
      # (.gitattributes, merge=uqf-generated), regenerate it with derive.py and
      # leave the result to commit (#1965). Does nothing when the merge driver
      # recorded nothing; the generated files' --check gates still decide.
      - id: regenerate-merged
        name: Regenerate the generated files a merge kept one side of
        entry: uv run python scripts/dev/merge_generated.py regenerate
        language: system
        always_run: true
        pass_filenames: false
        stages: [post-merge, post-rewrite]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.2.1
    hooks:
      - id: no-commit-to-branch
        args: ['--branch', 'master', '--branch', 'main']

  # Branch naming enforcement
  - repo: local
    hooks:
      - id: branch-naming-with-git-username
        name: Enforce git-username/branch-name convention with auto-rename
        entry: bash
        language: system
        args:
          - -c
          - |
            branch=$(git rev-parse --abbrev-ref HEAD)
            if [[ "$branch" == "master" || "$branch" == "main" || "$branch" =~ ^release/ ]]; then
              exit 0  # Skip check for protected branches
            fi

            # Try to get GitHub username from various sources
            github_username=""

            # Method 1: the git remote URL. Local, free, and correct - it
            # yields the same answer as the GitHub API for any GitHub remote.
            # This runs FIRST because the API call below costs ~0.57s of
            # network per commit, which measured as more than every test in
            # this repository combined.
            remote_url=$(git config --get remote.origin.url 2>/dev/null || echo "")
            if [[ "$remote_url" =~ github\.com[:/]([^/]+)/ ]]; then
              github_username="${BASH_REMATCH[1]}"
            fi

            # Method 2: ask GitHub, for a remote this cannot parse.
            if [[ -z "$github_username" ]] && command -v gh >/dev/null 2>&1 && gh auth status >/dev/null 2>&1; then
              github_username=$(gh api user --jq '.login' 2>/dev/null)
            fi

            # Method 3: normalized git config user.name. Last resort, because
            # it is a display name and need not match the GitHub login - here
            # it yields "krzysztofwojdalski" where the login is "kwojdalski",
            # which would rename a correctly-named branch.
            if [[ -z "$github_username" ]]; then
              github_username=$(git config user.name | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]//g')
            fi

            if [[ -z "$github_username" ]]; then
              echo "❌ Could not determine GitHub username"
              echo "Try: gh auth login, or ensure remote origin points to GitHub"
              exit 1
            fi

            if [[ "$branch" =~ ^[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+$ ]]; then
              branch_username=$(echo "$branch" | cut -d'/' -f1)
              if [[ "$branch_username" != "$github_username" ]]; then
                echo "❌ Branch username '$branch_username' doesn't match GitHub username '$github_username'"
                exit 1
              fi
              exit 0  # Branch already follows convention
            fi

            # Auto-rename branch to include GitHub username
            new_branch="${github_username}/${branch}"
            echo "🔄 Renaming branch from '$branch' to '$new_branch'"
            git branch -m "$new_branch"
            echo "✅ Branch renamed to follow convention with GitHub username"
        stages: [pre-commit]
        always_run: true
        pass_filenames: false

# Global settings
#
# A commit runs the fast set - format, lint, static gates, generated-file
# checks; a push runs the test suites (python-tests, q-tests, q-coverage) and
# the targeted PeachQ run (#1965); a merge or rebase regenerates what the
# generated-file merge driver kept. `pre-commit install` installs all four.
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, pre-push, post-merge, post-rewrite]
minimum_pre_commit_version: '3.0.0'
