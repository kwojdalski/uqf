# Pre-commit configuration for uqf (q/kdb+ quant library).
# Local hooks are scoped for q/qUnit since the library itself is pure q.
# The Python packages under python/ get ruff and pytest hooks over every .py
# file outside lib/.
repos:
  # Basic file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'  # Allow trailing spaces in markdown for line breaks
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=10240']  # 10MB limit for data files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Markdown and Quarto formatting/linting
  #
  # panache understands Quarto and Pandoc syntax that generic markdown
  # formatters mangle - fenced divs, attribute blocks, tables. It is the
  # reason this is not prettier or mdformat: docs/presentation/uqf.qmd
  # nests `::: {.column}` inside `::: {.columns}`, and only a formatter
  # that parses Pandoc gets the colon counts right.
  #
  # Three exclusions, and each would break something specific:
  #   lib/          vendored TorQ and the starter pack, which are never
  #                 edited - an edit survives until the next upgrade and is
  #                 then silently lost.
  #   processes.md  generated by scripts/generate/generate_operational_docs.py,
  #                 which CI runs with --check. Formatting it here would make
  #                 the two gates fight: panache rewrites it, the generator
  #                 says it no longer matches the registry, forever.
  #   web/          prettier already owns it - `npm run check` runs
  #                 `prettier --check .` over the package, web/README.md
  #                 included, and the CI job for it goes red the moment a
  #                 second formatter touches that file. One owner per file.
  #
  # Style lives in .panache.toml so a manual `panache format` matches the
  # hook. scripts/gates/check_hook_scopes.py fails a scope that matches
  # nothing, so both paths above have to stay real.
  - repo: https://github.com/jolars/panache-pre-commit
    rev: v3.12.0
    hooks:
      - id: panache-format
        exclude: '^(lib/|web/|docs/reference/processes\.md$)'
      - id: panache-lint
        exclude: '^(lib/|web/|docs/reference/processes\.md$)'

  # Python linting/formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      # Scoped by INTENT - every .py file except vendored - rather than by
      # directory. A directory list goes stale silently: this was scoped
      # '^python/uqf-client/' while Python was being added under
      # uqs/ and uqf_frontend/, so 43 of 47 tracked .py files
      # were never linted, and nothing complained because the scope was
      # still valid, merely too narrow. Matching all Python and excluding
      # lib/ cannot drift that way. scripts/gates/check_hook_scopes.py enforces it.
      - id: ruff
        name: ruff (all python)
        args: ['--fix']
        files: '\.py$'
        exclude: '^lib/'
      - id: ruff-format
        name: ruff-format (all python)
        files: '\.py$'
        exclude: '^lib/'

  - repo: local
    hooks:
      # Every Python test in the repository, from the uv workspace root.
      # This replaced a hook scoped to python/uqf_client alone, under which
      # 229 of the repo's 231 Python tests never ran on commit - and no CI
      # exists as a backstop. All 231 run in about 0.6s, so the gap was never
      # a cost question.
      - id: python-tests
        name: Run all Python tests (workspace)
        entry: bash
        language: system
        args:
          - -c
          - |
            set -euo pipefail
            # Some suites start a real q process (uqf_frontend's kola IPC
            # tests, uqs's example-script runs) and skip if they find no
            # interpreter. They find it by $QCMD, else q on PATH - TorQ's
            # rule (uqs.paths.q_interpreter). This hook used to put
            # ~/.kx/bin on PATH first, a second default TorQ does not have.
            uv run pytest -q
        files: '\.py$'
        exclude: '^lib/'
        pass_filenames: false

      - id: check-hook-scopes
        name: Check pre-commit hook scopes cover the code
        entry: python3 scripts/gates/check_hook_scopes.py
        language: system
        pass_filenames: false
        always_run: true

      # Static checks for q traps that produce a WRONG ANSWER rather than an
      # error - a lone `/` silently commenting out a whole file, a builtin
      # used as a parameter name, a `where col=col` that matches every row.
      # The q test suite cannot catch these: several of them made a file load
      # "successfully" or a check report a failure that never happened.
      # always_run because the rules scan every tracked .q file, not only the
      # staged ones - a rule added today should flag a file touched last
      # month.
      # The TYPE gate. Scoped like the lint and test gates - all Python,
      # vendored excluded - and enforced by check_hook_scopes.py so it
      # cannot narrow silently the way the lint hook once did.
      #
      # pass_filenames is false because ty type-checks a PROJECT, not a file
      # list: a change in one module can only be judged against the modules
      # that import it. Passing just the staged files would check each in
      # isolation and miss exactly the cross-module breakage a type checker
      # is for.
      - id: ty
        name: ty (all python)
        entry: uv run ty check
        language: system
        files: '\.py$'
        exclude: '^lib/'
        pass_filenames: false

      - id: q-traps
        name: Check q files for silent-failure traps
        entry: python3 scripts/gates/check_q_traps.py
        language: system
        pass_filenames: false
        always_run: true

      - id: doc-references
        name: Check the docs cite functions that exist
        entry: python3 scripts/gates/check_doc_references.py
        language: system
        pass_filenames: false
        always_run: true

      # The two generated artifacts that are pure functions of tracked
      # source, REGENERATED here rather than checked.
      #
      # Both ran in CI only, with `--check`, so forgetting to regenerate cost
      # a full round trip: commit, push, watch CI go red, run a command that
      # takes a fifth of a second, commit again. The new-job skill has a
      # step telling you to remember; a tool that remembers is better than a
      # document that reminds.
      #
      # Modify-and-fail, the contract ruff-format already uses in this file:
      # the hook rewrites the file and fails the commit, so you `git add` and
      # commit again with the regenerated artifact in the same change.
      #
      # NOT the third one. contract_surface needs KDB-X to load the whole q
      # tree, so it is CHECKED rather than regenerated, and lives with the
      # other interpreter-bound hooks below.
      #
      # NOT rendered-diagrams either, and that stays `--check` below for the
      # reason its own header gives: d2 lays out differently between
      # releases, so regenerating would start a churn war between two
      # developers on different versions. These two have no such skew.
      - id: man-registry
        name: Regenerate docs/man.q from the qDoc comments
        entry: python3 scripts/generate/generate_man_registry.py
        language: system
        pass_filenames: false
        files: ^src/.*\.q$

      - id: operational-docs
        name: Regenerate the process table and pipeline DAG from the registry
        entry: uv run python scripts/generate/generate_operational_docs.py
        language: system
        pass_filenames: false
        files: ^(src/etl/|scripts/processes/|python/uqs/src/uqs/model/)

      - id: rendered-diagrams
        name: Check the rendered diagrams match their d2 sources
        entry: python3 scripts/generate/render_diagrams.py --check
        language: system
        pass_filenames: false
        files: ^docs/diagrams/
        always_run: false

      - id: q-tests
        name: Run qUnit tests for uqf
        entry: bash
        language: system
        args:
          - -c
          - |
            set -euo pipefail
            # Through scripts/test.py, not a lookup of its own. This hook used
            # to find q itself - PATH, then ~/.kx/bin/q, then PeachQ at ./q and
            # ./peachq/q - which was the third different answer in this repo
            # to "which interpreter", and the only one that fell back to
            # something the tree is not verified on. test.py's rule is the
            # README's: $QCMD if you set it, otherwise q on PATH, as TorQ does.
            python3 scripts/test.py q-unit
            python3 scripts/test.py q-examples
            # The worked examples under scripts/examples/, run as scripts.
            # Nothing ran them until this lane existed, and the first
            # scenario added there found a false claim in uqs_tables.q about
            # `quotes` being usable by cross_book_at unreshaped.
            python3 scripts/test.py q-scripts
        files: '\.q$'
        pass_filenames: false

      - id: doc-links
        name: Check every link and anchor in docs/ resolves
        # Asks Quarto to resolve each link the way a reader's browser will,
        # then checks the #fragment Quarto ignores. Nothing else covered
        # either: check_doc_references.py holds the prose to the q FUNCTIONS
        # it names, and a path that appears in no generated artifact had
        # nothing to disagree with.
        #
        # --allow-missing, unlike the contract-surface hook below, because
        # the asymmetry runs the other way: a hosted runner cannot have
        # KDB-X but installing Quarto is one step, so CI is the environment
        # that CAN enforce and does - it runs this with no flag. A q
        # developer without Quarto gets a warning here rather than a block.
        entry: uv run python scripts/gates/check_doc_links.py --allow-missing
        language: system
        pass_filenames: false
        files: '^docs/.*\.(md|qmd)$|^docs/_quarto\.yml$|^scripts/gates/check_doc_links\.py$'
      - id: contract-surface
        name: Check the committed contract surface matches the tree
        # docs/reference/surfaces/current/ used to be checked in CI alone,
        # and hosted CI has no KDB-X, so that check skipped on every run:
        # nothing verified the surface at all. Here it runs wherever the
        # q tests run, and like them it FAILS without an interpreter rather
        # than skipping - CI opts out explicitly, through SKIP, with a
        # warning. `check`, not `export`: the check compares contracts, so an
        # interpreter upgrade that changes nothing public changes nothing.
        # To accept an intended change:
        #   uv run python scripts/generate/contract_surface.py export
        entry: uv run python scripts/generate/contract_surface.py check
        language: system
        pass_filenames: false
        # q for functions and tables, the Python registry for processes, the
        # env scan over both for variables.
        files: '\.(q|py)$|^scripts/processes/'

      - id: q-coverage
        name: Check every function a test should reach is reached
        entry: bash
        language: system
        args:
          - -c
          - |
            set -euo pipefail
            # Runs the whole suite a SECOND time, under .cov's in-memory
            # instrumentation, and fails when the set of functions nothing
            # enters differs from tests/q/coverage_baseline.txt - in either
            # direction. A new blind spot is a failure; so is a baseline
            # entry whose gap has been closed, because a list that only grows
            # stops describing anything.
            #
            # Through scripts/test.py for the same reason the hook above is:
            # one rule for which interpreter ($QCMD, else q on PATH), never a
            # fallback to something the tree is not verified on.
            #
            # It roughly doubles the time a q commit takes (~14s on top of
            # the suite's own ~13s). If that becomes the reason people reach
            # for --no-verify, move this one hook to `stages: [pre-push]`
            # rather than dropping it: the check is cheap compared to
            # noticing months later that nothing calls a function.
            python3 scripts/test.py q-coverage
        files: '\.q$'
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.2.1
    hooks:
      - id: no-commit-to-branch
        args: ['--branch', 'master', '--branch', 'main']

  # Branch naming enforcement
  - repo: local
    hooks:
      - id: branch-naming-with-git-username
        name: Enforce git-username/branch-name convention with auto-rename
        entry: bash
        language: system
        args:
          - -c
          - |
            branch=$(git rev-parse --abbrev-ref HEAD)
            if [[ "$branch" == "master" || "$branch" == "main" || "$branch" =~ ^release/ ]]; then
              exit 0  # Skip check for protected branches
            fi

            # Try to get GitHub username from various sources
            github_username=""

            # Method 1: the git remote URL. Local, free, and correct - it
            # yields the same answer as the GitHub API for any GitHub remote.
            # This runs FIRST because the API call below costs ~0.57s of
            # network per commit, which measured as more than every test in
            # this repository combined.
            remote_url=$(git config --get remote.origin.url 2>/dev/null || echo "")
            if [[ "$remote_url" =~ github\.com[:/]([^/]+)/ ]]; then
              github_username="${BASH_REMATCH[1]}"
            fi

            # Method 2: ask GitHub, for a remote this cannot parse.
            if [[ -z "$github_username" ]] && command -v gh >/dev/null 2>&1 && gh auth status >/dev/null 2>&1; then
              github_username=$(gh api user --jq '.login' 2>/dev/null)
            fi

            # Method 3: normalized git config user.name. Last resort, because
            # it is a display name and need not match the GitHub login - here
            # it yields "krzysztofwojdalski" where the login is "kwojdalski",
            # which would rename a correctly-named branch.
            if [[ -z "$github_username" ]]; then
              github_username=$(git config user.name | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]//g')
            fi

            if [[ -z "$github_username" ]]; then
              echo "❌ Could not determine GitHub username"
              echo "Try: gh auth login, or ensure remote origin points to GitHub"
              exit 1
            fi

            if [[ "$branch" =~ ^[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+$ ]]; then
              branch_username=$(echo "$branch" | cut -d'/' -f1)
              if [[ "$branch_username" != "$github_username" ]]; then
                echo "❌ Branch username '$branch_username' doesn't match GitHub username '$github_username'"
                exit 1
              fi
              exit 0  # Branch already follows convention
            fi

            # Auto-rename branch to include GitHub username
            new_branch="${github_username}/${branch}"
            echo "🔄 Renaming branch from '$branch' to '$new_branch'"
            git branch -m "$new_branch"
            echo "✅ Branch renamed to follow convention with GitHub username"
        stages: [pre-commit]
        always_run: true
        pass_filenames: false

# Global settings
default_stages: [pre-commit]
minimum_pre_commit_version: '3.0.0'
