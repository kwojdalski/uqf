# The uqf frontend's access model (#2045): role-based access to FEATURES and
# the ACTIONS on them. Versioned with the code; a deployment changes its
# POLICY (UQF_FRONTEND_POLICY_FILE), never this file. See access.py.
#
#   sub  a user (the trusted identity header's value), a group, `anonymous`,
#        or `*` in a policy line - everyone, anonymous callers included.
#        access.enforcer loads names as `user:<name>` / `group:<name>`, and
#        a request asks as Identity.subjects, so a user is never a group
#        of the same name (#2525)
#   obj  a feature, from access.FEATURES, or `*`
#   act  `read` or `write`, or `*`

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = (p.sub == "*" || g(r.sub, p.sub)) && (p.obj == "*" || r.obj == p.obj) && (p.act == "*" || r.act == p.act)
