[project]
name = "uqf-frontend"
version = "0.1.0"
description = "Backend-for-frontend over the uqf TorQ gateway: validated, parameterised q queries for a browser client"
readme = "README.md"
authors = [
    { name = "Krzysztof Wojdalski", email = "krzysztof.wojdalski@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "kola>=2.5.0",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn>=0.32",
    # For the /control/* routes only, and imported lazily inside them so a
    # read-only deployment never pays for it. This package deliberately did
    # NOT depend on the orchestrator before - procfile.py records that rule
    # and its reason, which was about not coupling a hot read path for two
    # lines of regex. That reasoning does not survive contact with STARTING A
    # PROCESS: runtime.start shells out to torq.sh under an environment built
    # from the vendored tree, and procs.set_process_config owns the field
    # whitelist and the read-modify-write against process_overrides.csv.
    # Reimplementing either here would make a second writer to one file,
    # which is worse than a dependency by any measure used in this tree.
    "uqs",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "httpx>=0.28",
]

# ruff and pytest configuration live in the repository-root pyproject.toml,
# which is the uv workspace root - see its header. Keeping a [tool.ruff] block
# here would shadow the shared one, since ruff resolves the nearest config.
