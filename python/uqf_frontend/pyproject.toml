[project]
name = "uqf-frontend"
version = "0.1.0"
description = "Backend-for-frontend over the uqf TorQ gateway: validated, parameterised q queries for a browser client"
readme = "README.md"
authors = [
    { name = "Krzysztof Wojdalski", email = "krzysztof.wojdalski@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "kola>=2.5.0",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn>=0.32",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "httpx>=0.28",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
