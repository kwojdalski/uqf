[project]
name = "uqf-stack"
version = "0.1.0"
description = "Bridges lib/torq + lib/torq-finance-starter-pack into a runnable demo (CLI + MCP server)"
readme = "README.md"
authors = [
    { name = "Krzysztof Wojdalski", email = "krzysztof.wojdalski@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=3.4.7",
    "kola>=2.5.0",
    "loguru>=0.7.3",
    "polars>=1.31.0",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
uqf-stack = "uqf_stack.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

# ruff and pytest configuration live in the repository-root pyproject.toml,
# which is the uv workspace root - see its header. Keeping a [tool.ruff] block
# here would shadow the shared one, since ruff resolves the nearest config.
