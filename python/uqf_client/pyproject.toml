[project]
name = "uqf-client"
version = "0.1.0"
description = "Python/Polars client for a running uqf q session, over kdb+ IPC via kola"
readme = "README.md"
authors = [
    { name = "Krzysztof Wojdalski", email = "krzysztof.wojdalski@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "kola>=2.5.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
