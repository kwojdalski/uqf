[project]
name = "uqf-client"
version = "0.1.0"
description = "Python/Polars client for a running uqf q session, over kdb+ IPC via kola"
readme = "README.md"
authors = [
    { name = "Krzysztof Wojdalski", email = "krzysztof.wojdalski@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "kola>=2.5.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

# ruff and pytest configuration live in the repository-root pyproject.toml,
# which is the uv workspace root - see its header. Keeping a [tool.ruff] block
# here would shadow the shared one, since ruff resolves the nearest config.
