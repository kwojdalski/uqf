# uv workspace root for this repository's three Python packages.
#
# A workspace rather than a flat merge: each member keeps its own
# pyproject.toml, and therefore its own distribution name and console script
# (uqf-stack), while this root owns the single lockfile, the single .venv, and
# the shared ruff/pytest config that was previously duplicated verbatim in
# all three members.
#
# Why consolidate at all: the three packages have zero import-time
# dependencies on each other, and every shared constraint is an open lower
# bound, so one resolution is satisfiable by inspection. Before this, three
# separate .venv directories totalled ~1.1 GB and the three lockfiles had
# drifted to three different ruff versions (0.16.2 / 0.16.4 / 0.16.7), none
# of which matched the version .pre-commit-config.yaml pins. Ruff is pinned
# exactly here so the hook and the environment can no longer disagree.
#
# The directory layout is deliberately unchanged, because two couplings
# depend on it and are documented as such at their call sites:
#   - python/uqf_frontend/tests/test_catalog_drift.py resolves parents[2] to
#     read uqf_stack's core.py as TEXT (never importing it)
#   - python/uqf_client/tests/conftest.py resolves parents[3] to the repo
#     root so it can launch `q src/init.q`
# Moving the packages would break both.
#
# This root is not itself a distributable package - see [tool.uv] package.

[project]
name = "uqf-workspace"
version = "0.0.0"
description = "Workspace root aggregating uqf's Python packages; not published"
requires-python = ">=3.14"
dependencies = [
    "uqf-client",
    "uqf-stack",
    "uqf-frontend",
    "uqf-airflow-provider",
]

[tool.uv]
# An aggregator, not a package: nothing here to build or install.
package = false

# Read by qlinter (https://github.com/kwojdalski/q-lint), which walks up from
# the file it is linting looking for this section. The tool is installed
# separately and is not a dependency of this project - this is only the
# exclusion list, so nobody has to remember `--exclude` for the vendored tree
# or for the agent worktrees nested inside the repository.
[tool.q-lint]
exclude = ["lib/torq/", ".claude/worktrees/"]

[tool.uv.workspace]
members = [
    "python/uqf_client",
    "python/uqf_stack",
    "python/uqf_frontend",
    "python/uqf_airflow_provider",
]

# A member needs THREE entries, not one: `members` above (so uv knows it is
# part of the workspace), `dependencies` (so the root venv installs it), and
# a `workspace = true` source here (so the dependency resolves locally rather
# than from an index). Registering only `members` leaves the package
# uninstalled, and its tests then fail to import rather than being reported
# as missing - which is the same silently-never-runs shape as a pre-commit
# scope that matches nothing.
[tool.uv.sources]
uqf-client = { workspace = true }
uqf-stack = { workspace = true }
uqf-frontend = { workspace = true }
uqf-airflow-provider = { workspace = true }

[dependency-groups]
# httpx is uqf_frontend's test-only dependency (fastapi's TestClient); it
# lives here because the dev group is shared across the workspace.
dev = [
    "pytest>=9.1.1",
    # `scripts/test.py coverage`. A dev dependency rather than something
    # fetched on demand, so the coverage number is reproducible from the
    # lockfile like every other result here.
    "pytest-cov>=7.0",
    "ruff==0.16.2",
    # Pinned exactly, like ruff: a type checker that changes its mind between
    # machines turns a clean gate into an argument about whose version is
    # right. Bump deliberately, with the findings reviewed.
    "ty==0.0.81",
    "httpx>=0.28",
]

# ---------------------------------------------------------------- ty
#
# The type gate. Two scoping decisions, both matching ruff's for the same
# reasons:
#
#   * `lib/` is vendored and never edited here, so findings in it are noise
#     that cannot be acted on - and noise is what gets a gate suppressed.
#   * the three members' src roots are declared, so ty resolves intra-package
#     imports the same way ruff's isort does. Without them every
#     `from uqf_frontend...` is an unresolved-import, which buries the real
#     findings under ten fake ones.
[tool.ty.src]
# `.claude/worktrees` holds agent worktrees, which are full CHECKOUTS of this
# repository nested inside it. Without excluding them every gate scans the
# repo twice - reporting duplicate findings, and reporting them against the
# vendored code in the copy, which is doubly unactionable. The harness
# creates these, so this is a standing exclusion rather than a workaround.
#
# `tools` is the same thing for a different reason: it holds local checkouts of
# the q linter, which is its own project installed separately (see CLAUDE.md).
# Type errors in another repository's source are not actionable here, and left
# unexcluded they fail this hook and block every commit in this one.
exclude = ["lib", ".venv", "build", ".claude/worktrees", "tools"]

[tool.ty.environment]
root = [
    "python/uqf_client/src",
    "python/uqf_stack/src",
    "python/uqf_frontend/src",
]

# No [tool.ty.rules] block, deliberately.
#
# The first version of this config relaxed `unresolved-attribute` to a warning
# on the grounds that kola ships no type information. That turned out to be
# wrong twice over: kola produced none of the findings, and the nine that did
# appear were all in this repo's own code - seven of them a genuine latent
# AttributeError, since `Callable` really has no `__name__` and these
# decorators accept callable class instances. Relaxing the rule would have
# hidden a real bug to silence a problem that did not exist.
#
# Everything is now clean at full strength, so there is nothing to relax. A
# third-party gap that genuinely cannot be fixed here gets a narrow
# `# ty: ignore[rule]` at the line, with the reason - see core.py's
# deliberate read of loguru's private `_core`.

[tool.ruff]
line-length = 100
target-version = "py314"

# Vendored trees are never edited here, so linting them produces findings
# nobody may act on - lib/kdb-parquet alone has 32. The pre-commit hook
# already carried `exclude: '^lib/'`; this is the same rule for a bare
# `ruff check .` from the repo root, so the CLI and the hook cannot disagree.
# `.claude/worktrees` holds agent worktrees - nested checkouts of this same
# repository. Scanning them lints the repo twice and surfaces findings in the
# copy's vendored tree. See the note in [tool.ty.src].
extend-exclude = ["lib", ".claude/worktrees"]

# Each member's source root, so isort still classifies the three packages as
# first-party. Run from inside a member, ruff infers this from the src layout;
# run from the workspace root it cannot, and every intra-package import gets
# treated as third-party - which silently reformats 13 files' import blocks.
src = [
    "python/uqf_client/src",
    "python/uqf_stack/src",
    "python/uqf_frontend/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
# All three members' suites, so `uv run pytest` from the repo root is the
# single command that runs every Python test. The pre-commit hook relies on
# this: before it existed, 229 of the repository's 231 Python tests never ran
# on commit.
testpaths = [
    "python/uqf_client/tests",
    "python/uqf_stack/tests",
    "python/uqf_frontend/tests",
    "python/uqf_airflow_provider/tests",
]
