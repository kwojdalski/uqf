name: KDB-X attestation

# Blocking (#1014, #1543): hosted CI has no KDB-X, so whether the KDB-X
# hooks (HOOKS in scripts/dev/attest_kdbx.py) passed on a PR's tree is known
# only where they ran. attest_kdbx.py runs the ones whose scope the branch
# touches and records them as a `KDB-X-gates: <tree> hooks=<ids>` trailer;
# this fails a PR unless the head's exact tree carries trailers covering
# every hook whose scope the PR's diff (from the merge base) touches. PRs
# only: a push to master is not re-judged after the merge.
#
# q-tests may have run only the q suites the change reaches (#1690), recorded
# as `q-tests=<sha256 of the sorted file names>`. The check makes the same
# selection here - scripts/dev/test_impact.py over the PR's diff and the head's
# tree - with q-lint's `analyze graph`, which no release has yet: so this
# installs the q-lint commit .qlinter-graph-rev pins, the one an attestation's
# selection must have been made with to agree. `q-tests=all` needs none of it.
#
# Override: the `kdbx-attestation-override` PR label lets an unattested tree
# pass, as a warning annotation naming the label and the paths. It is its own
# workflow, not a job in ci.yml, so adding or removing that label re-runs
# only this check rather than the whole of CI.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: kdbx-attestation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kdbx-attestation:
    name: KDB-X attestation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Restore the graph-capable qlinter
        id: qlint-graph-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uqf/qlint-graph
          key: qlint-graph-${{ runner.os }}-${{ hashFiles('.qlinter-graph-rev') }}
      - name: Install the graph-capable qlinter (.qlinter-graph-rev)
        if: steps.qlint-graph-cache.outputs.cache-hit != 'true'
        run: |
          read -r rev < .qlinter-graph-rev
          cargo install --git https://github.com/kwojdalski/q-lint --rev "$rev" --locked --root ~/.cache/uqf/qlint-graph
      - name: Require the KDB-X gates to have passed on this tree
        env:
          UQF_QLINTER: /home/runner/.cache/uqf/qlint-graph/bin/qlinter
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          KDBX_ATTESTATION_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'kdbx-attestation-override') }}
        run: python3 scripts/gates/check_kdbx_attestation.py "$BASE" "$HEAD" "$GITHUB_STEP_SUMMARY"
