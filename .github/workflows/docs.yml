# Publishes docs/ to GitHub Pages.
#
# The site is the one docs/_quarto.yml already describes - the same project
# the doc-links gate renders on every push to check that each link and anchor
# resolves. Deploying it is a second use of a build that was happening anyway,
# rather than a second documentation toolchain: no .md file is converted, and
# the revealjs deck renders as a deck rather than being flattened into a page.
#
# PAGES MUST BE ENABLED for this repository, with its source set to "GitHub
# Actions", before the deploy job can succeed. Until then the build job still
# runs and still fails on a broken link, which is the half that matters.
name: Documentation site

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      # The q API pages are written from these at render time.
      - "src/**/*.q"
      - "scripts/generate/q_api_docs.py"
      - "scripts/generate/export_api_reference.q"
      - "scripts/peachq.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one half-way: a cancelled deploy can
# leave Pages serving a partially-written site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Quarto
        # Pinned to the version ci.yml installs, so the published site and the
        # link gate cannot be produced by two different renderers.
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"
      - name: Restore PeachQ built from its pinned commit
        # The render's pre-render step writes the q API pages from the qDoc
        # comments (scripts/generate/q_api_docs.py), which needs a q. PeachQ
        # is the one a hosted runner can have; same pin and cache as ci.yml.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uqf/peachq
          key: peachq-${{ hashFiles('scripts/peachq.json') }}-${{ runner.os }}-${{ runner.arch }}
      - name: Provide PeachQ for the q API pages
        # Builds the pinned commit on a cold cache (about 40s). Through QCMD
        # only, as everywhere else: nothing is put on PATH.
        shell: bash
        run: |
          set -euo pipefail
          bin="$(python3 scripts/peachq.py)"
          echo "QCMD=$bin" >> "$GITHUB_ENV"
      - name: Render docs/
        working-directory: docs
        run: quarto render
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
