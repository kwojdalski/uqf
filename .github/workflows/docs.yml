# Publishes the exact site that a successful master CI run rendered and checked.
# No checkout or rendering here: the source run and SHA identify the artifact.
name: Documentation site

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "Successful master push CI run whose validated site to publish"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run also fires for PR CI. Only a successful push to this
    # repository's master may supply a site, including on a manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify the source CI run
        id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const runId = Number(context.payload.workflow_run?.id ?? context.payload.inputs?.ci_run_id);
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              throw new Error('ci_run_id must be a positive integer');
            }
            const {data: run} = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: runId,
            });
            if (run.path !== '.github/workflows/ci.yml' ||
                run.head_repository.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                run.event !== 'push' || run.head_branch !== 'master' ||
                run.status !== 'completed' || run.conclusion !== 'success') {
              throw new Error('Only a successful master push CI run may publish documentation');
            }
            core.setOutput('sha', run.head_sha);
      - name: Download that run's validated site
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: docs-site-${{ steps.source.outputs.sha }}
          path: ${{ runner.temp }}/docs-site
          run-id: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/docs-site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
