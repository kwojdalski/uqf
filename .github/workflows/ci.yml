name: CI

# The full, clean run (#1879): a Linux checkout with nothing left over, PeachQ
# as its q. A commit's hooks are targeted (scripts/dev/hooks_full.py); this is
# where every check runs in full - every job on master, and on a pull request
# the hooks and static gates plus each complete verification group its change
# can affect ("Docs links", "PeachQ q tests", "Browser application", "PeachQ
# Python tests"; scripts/dev/ci_scope.py decides, in the "Scope" job, and says
# why in its summary). Full mode runs every group: every push, a `ci:full`
# label on the pull request, or workflow_dispatch with `full: true`.

on:
  push:
    branches: [master]
  pull_request:
    # `labeled` so adding `ci:full` re-runs this in full. Any other label
    # re-runs it as an ordinary run of the same head: never a run that
    # reports without checking (a skipped required check counts as passed).
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      full:
        description: "Run every job, whatever the branch changes"
        type: boolean
        default: false
  # release.yml runs these same checks before it builds an artifact (#872),
  # every one of them.
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true

permissions:
  contents: read
  issues: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push to a PR makes its older run moot; on master every commit needs
  # a finished result, or a red master goes unseen (31 of 52 master runs were
  # cancelled before this).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  author:
    name: Pull request author
    # Only pull requests authored by kwojdalski may merge (CONTRIBUTING.md).
    # No checkout: another author's code never runs here. The login reaches
    # the script through env, never interpolated into it. On a push to master
    # there is no pull request, and the job succeeds.
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: The author is the owner
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$PR_AUTHOR" != kwojdalski ]; then
            echo "::error::Pull requests are accepted only from kwojdalski; this one is by $PR_AUTHOR. See CONTRIBUTING.md."
            exit 1
          fi
          echo "author check passed ($EVENT${PR_AUTHOR:+ by $PR_AUTHOR})"
  scope:
    name: Scope
    # Which verification groups this run needs, and why (the step summary).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      docs: ${{ steps.scope.outputs.docs }}
      q: ${{ steps.scope.outputs.q }}
      frontend: ${{ steps.scope.outputs.frontend }}
      python: ${{ steps.scope.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # the merge base, for the pull request's three-dot diff
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        # The repository's Python: ci_scope.py reads q_readers from
        # scripts/dev/test_impact.py, written for 3.14.
        with:
          version: "0.12.14"
          python-version: "3.14"
      - name: Decide which verification groups run
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || 'origin/master' }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          FULL: ${{ inputs.full }}
        run: >-
          uv run --no-project --python 3.14 python scripts/dev/ci_scope.py
          --event "$EVENT" --base "$BASE" --head "$HEAD" --labels "$LABELS" --full-input "$FULL"
          --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  checks:
    name: Hooks and static gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # uv run inside the hooks must use the committed resolution.
      UV_LOCKED: "true"
      # Every hook over every file, in a clean clone (#1879). A commit's
      # hooks see only what it stages, in a working tree with whatever else
      # is lying in it, and a merge commit or a commit made without the hooks
      # installed runs none of them; this is the run that holds the tree as
      # pushed. Under two minutes, and off the critical path.
      #
      # Skipped here, each because it runs elsewhere or does not apply:
      #   no-commit-to-branch, branch-naming-with-git-username - they govern
      #     local commits and branch names, not a detached PR merge ref;
      #   q-docs-peachq - it would build PeachQ inside the hooks; the PeachQ
      #     Python shards run the docs' q blocks on PeachQ
      #     (tests/qrun/test_doc_blocks.py);
      #   python-tests - the "PeachQ Python tests" shards run every testpath
      #     with a q, whenever the change can reach a Python test: the same
      #     suite plus what needs a q;
      #   doc-links - the "Docs links" job runs it strictly, in parallel; here
      #     it was 37s of the hooks' 49s, and then ran a second time (#1689);
      #   peachq-push - the early, targeted PeachQ catch before a push (#1965);
      #     the "PeachQ q tests" job runs the whole suite on PeachQ.
      SKIP: no-commit-to-branch,branch-naming-with-git-username,q-docs-peachq,python-tests,doc-links,peachq-push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.14"
          python-version: "3.14"
          enable-cache: true
      - name: Install workspace dependencies
        run: uv sync --locked
      - name: Install d2
        # The rendered-diagrams check compares each committed .svg with a
        # fresh render, and used to skip with "no d2 on PATH" on every CI run
        # because nothing installed it (#1369). The version is read from
        # render_diagrams.py (D2_VERSION), through `derive.py diagrams
        # --print-version`, so it has one home; the sha256 is
        # for that release's linux-amd64 tarball (the release publishes no
        # checksum file), so a bump of D2_VERSION fails here until the hash
        # is updated on purpose.
        shell: bash
        env:
          D2_SHA256: 5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9
        run: |
          set -euo pipefail
          D2_VERSION="$(python3 scripts/generate/derive.py diagrams --print-version)"
          curl -sSfL "https://github.com/terrastruct/d2/releases/download/${D2_VERSION}/d2-${D2_VERSION}-linux-amd64.tar.gz" -o /tmp/d2.tar.gz
          echo "${D2_SHA256}  /tmp/d2.tar.gz" | sha256sum -c -
          tar xzf /tmp/d2.tar.gz -C /tmp
          install -m755 "/tmp/d2-${D2_VERSION}/bin/d2" /usr/local/bin/d2
          d2 --version
      - name: Install qlinter
        shell: bash
        # The q-traps hook delegates most of its rules to the
        # standalone linter, and refuses rather than passing vacuously when
        # it is missing. Pinned: the linter releases on its own cadence, and
        # a new rule landing upstream must not turn this repository red
        # without anyone choosing it. The pin lives in .qlinter-version, the
        # one place it is written; the hook refuses any other version.
        run: |
          set -euo pipefail
          read -r QLINT_VERSION < .qlinter-version
          url="https://github.com/kwojdalski/q-lint/releases/download/${QLINT_VERSION}/qlinter-${QLINT_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL "$url" -o /tmp/qlinter.tar.gz
          tar xzf /tmp/qlinter.tar.gz -C /tmp
          install -m755 "/tmp/qlinter-${QLINT_VERSION}-x86_64-unknown-linux-gnu/qlinter" /usr/local/bin/qlinter
          qlinter --rules > /dev/null && echo "qlinter ${QLINT_VERSION} installed"
      - name: Report q runtime coverage
        shell: bash
        run: |
          # The same rule pytest's `kdbx` fixture applies, so CI skips exactly when
          # the hook would have nothing to run: $QCMD, else q on PATH.
          if command -v "${QCMD:-q}" >/dev/null; then
            echo "A q interpreter is available; the q-tests and q-coverage hooks will run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SKIP=$SKIP,q-tests,q-coverage,q-docs,contract-surface,q-facts,plant-schema" >> "$GITHUB_ENV"
            echo "::warning::No q interpreter on this runner. The full qUnit suite, the coverage gate and q-dependent Python IPC tests are not exercised here; static q checks still run, and the portable qUnit suites run on PeachQ further down."
            echo "### Runtime coverage limitation" >> "$GITHUB_STEP_SUMMARY"
            echo "No q interpreter is installed on this hosted runner. The qUnit, coverage and contract-surface hooks are skipped, and Python tests requiring q skip through their existing fixtures. Static q checks and the remaining Python tests run. Run uv run pytest tests/qrun/test_q_suite.py and uv run pytest -m coverage tests/qrun/test_q_coverage.py locally with KDB-X before merging q changes." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run repository hooks
        run: uv tool run --from pre-commit==4.6.2 pre-commit run --all-files --show-diff-on-failure
      # The hooks a developer's `git push` runs (#1965): q-tests and q-coverage,
      # which need a q - skipped above when the runner has none - and the two
      # this job SKIPs for running elsewhere (python-tests, peachq-push).
      - name: Run repository push hooks
        run: uv tool run --from pre-commit==4.6.2 pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure
      # The gates that used to follow here as steps of their own are hooks
      # now, run above by `pre-commit run --all-files` (#1879): the module
      # graph, the ETL layering, the q line budget, the registry enlist
      # idiom, the environment and declaration references, nested contexts,
      # the diagram ports, the doc references and the operational docs. The
      # contract surface needs KDB-X, which no hosted runner has: the
      # contract-surface hook checks it, and the KDB-X attestation check
      # holds a pull request to having run it.
      - name: Check the rendered diagrams match their d2 sources
        # An .svg committed beside its .d2 is a derived artefact, and this
        # tree knows what happens to those without a gate - docs/man.q once
        # called itself generated while covering 78 of 348 functions. Skips with a
        # notice when d2 is absent or is a different version, since the
        # bytes are only comparable for one renderer (see the script). CI
        # installs the pinned d2 above and passes --require, so here it can
        # fail but not skip - the one static check this job runs beyond the
        # hooks, because the rendered-diagrams hook skips without that d2.
        if: ${{ !cancelled() }}
        run: python3 scripts/generate/derive.py diagrams --check --require

  peachq-q:
    name: PeachQ q tests
    # Only when the change can alter the q suite's result, or in full mode
    # (scripts/dev/ci_scope.py).
    needs: scope
    if: ${{ needs.scope.outputs.q == 'true' }}
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      UV_LOCKED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.14"
          python-version: "3.14"
          enable-cache: true
      - name: Install workspace dependencies
        run: uv sync --locked
      - name: Restore PeachQ built from its pinned commit
        # PeachQ is an MIT-licensed q, so unlike KDB-X a hosted runner can
        # have one - which makes it the only interpreter CI can run q with.
        #
        # Built from a pinned COMMIT, not downloaded. The v0.88 release asset
        # was rebuilt and re-uploaded under the same tag three times in five
        # days (#578 and after), each turning every run red at the checksum
        # until someone re-pinned to whatever upstream had published - which
        # makes the pin a formality. A commit hash cannot change under us.
        #
        # The pin and the build options are scripts/peachq.json, the same
        # file the local lanes build from (#719): moving either is one edit
        # there, and it changes this key. The cache is the resolver's own
        # (~/.cache/uqf/peachq), so a hit is a warm cache and needs no network.
        id: peachq-cache
        if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uqf/peachq
          key: peachq-${{ hashFiles('scripts/peachq.json') }}-${{ runner.os }}-${{ runner.arch }}
      - name: Provide PeachQ beside the tree
        # scripts/peachq.py reuses the cached build, or fetches the pinned
        # commit, checks it out, verifies the hash, builds it with this
        # platform's options and identifies the result - about 40s, once per
        # pin. It prints an absolute path and puts nothing on PATH: every
        # other step still finds no q, so nothing here can be mistaken for a
        # KDB-X run. It is reached only by the steps below, which name it
        # through QCMD and nothing else (#1753): uqs and the
        # pytest conftest ask the binary which q it is.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bin="$(python3 scripts/peachq.py)"
          # A binary that will not even start fails here, by name, rather
          # than as a confusing first lane.
          printf 'exit 0\n' > "$RUNNER_TEMP/peachq-smoke.q"
          "$bin" "$RUNNER_TEMP/peachq-smoke.q" -q
          echo "PEACHQ_BIN=$bin" >> "$GITHUB_ENV"
          echo "PeachQ: built from peachq-org/peachq@$(python3 scripts/peachq.py --commit)" >> "$GITHUB_STEP_SUMMARY"
      - name: Run the whole qUnit suite on PeachQ, flattened (blocking)
        # The q tests CI can hold a merge to. This runner has no KDB-X, and
        # PeachQ rejects nested contexts, so scripts/portable/full_suite.py
        # flattens a copy of the tree first (#856) and runs every suite on it.
        # The result is held to tests/q/peachq_known_gaps.txt both ways: a
        # failure not listed fails the build, and so does a listed test that
        # now passes - the list only shrinks (#863).
        if: ${{ !cancelled() && env.PEACHQ_BIN != '' }}
        timeout-minutes: 10
        # tests/qrun/test_q_suite.py drives it (#1808), and --require-q peachq
        # fails it, rather than skipping, should PeachQ not be had.
        run: QCMD="$PEACHQ_BIN" uv run pytest -q -rs --require-q peachq -m "q_suite and peachq" tests/qrun/test_q_suite.py

  peachq-python:
    name: PeachQ Python tests (${{ matrix.shard }}/${{ strategy.job-total }})
    # Every change but a web/ file no Python file names, or in full mode
    # (scripts/dev/ci_scope.py): a .q file (the tests start q), a document
    # (tests/qrun runs its q blocks), anything a gate's tests read.
    needs: scope
    if: ${{ needs.scope.outputs.python == 'true' }}
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    # Four runners, a quarter of the test modules each (#1696): on one 4-vCPU
    # runner the suite is CPU-bound, and more xdist workers measured no faster
    # (#1695). scripts/dev/pytest_shards.py splits by module, balanced by
    # scripts/dev/test_module_durations.json; every module is in exactly one
    # shard whatever that record says. "Repository checks" needs every shard.
    # The count is the matrix's length and nothing else: the name and --shard
    # read it as strategy.job-total, so adding a shard is one edit to the list.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      UV_LOCKED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.14"
          python-version: "3.14"
          enable-cache: true
      - name: Install workspace dependencies
        run: uv sync --locked
      - name: Install qlinter (the gates' own tests use it)
        shell: bash
        # The q-traps hook delegates most of its rules to the
        # standalone linter, and refuses rather than passing vacuously when
        # it is missing. Pinned: the linter releases on its own cadence, and
        # a new rule landing upstream must not turn this repository red
        # without anyone choosing it. The pin lives in .qlinter-version, the
        # one place it is written; the hook refuses any other version.
        run: |
          set -euo pipefail
          read -r QLINT_VERSION < .qlinter-version
          url="https://github.com/kwojdalski/q-lint/releases/download/${QLINT_VERSION}/qlinter-${QLINT_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL "$url" -o /tmp/qlinter.tar.gz
          tar xzf /tmp/qlinter.tar.gz -C /tmp
          install -m755 "/tmp/qlinter-${QLINT_VERSION}-x86_64-unknown-linux-gnu/qlinter" /usr/local/bin/qlinter
          qlinter --rules > /dev/null && echo "qlinter ${QLINT_VERSION} installed"
      - name: Restore PeachQ built from its pinned commit
        # PeachQ is an MIT-licensed q, so unlike KDB-X a hosted runner can
        # have one - which makes it the only interpreter CI can run q with.
        #
        # Built from a pinned COMMIT, not downloaded. The v0.88 release asset
        # was rebuilt and re-uploaded under the same tag three times in five
        # days (#578 and after), each turning every run red at the checksum
        # until someone re-pinned to whatever upstream had published - which
        # makes the pin a formality. A commit hash cannot change under us.
        #
        # The pin and the build options are scripts/peachq.json, the same
        # file the local lanes build from (#719): moving either is one edit
        # there, and it changes this key. The cache is the resolver's own
        # (~/.cache/uqf/peachq), so a hit is a warm cache and needs no network.
        id: peachq-cache
        if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uqf/peachq
          key: peachq-${{ hashFiles('scripts/peachq.json') }}-${{ runner.os }}-${{ runner.arch }}
      - name: Provide PeachQ beside the tree
        # scripts/peachq.py reuses the cached build, or fetches the pinned
        # commit, checks it out, verifies the hash, builds it with this
        # platform's options and identifies the result - about 40s, once per
        # pin. It prints an absolute path and puts nothing on PATH: every
        # other step still finds no q, so nothing here can be mistaken for a
        # KDB-X run. It is reached only by the steps below, which name it
        # through QCMD and nothing else (#1753): uqs and the
        # pytest conftest ask the binary which q it is.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bin="$(python3 scripts/peachq.py)"
          # A binary that will not even start fails here, by name, rather
          # than as a confusing first lane.
          printf 'exit 0\n' > "$RUNNER_TEMP/peachq-smoke.q"
          "$bin" "$RUNNER_TEMP/peachq-smoke.q" -q
          echo "PEACHQ_BIN=$bin" >> "$GITHUB_ENV"
          echo "PeachQ: built from peachq-org/peachq@$(python3 scripts/peachq.py --commit)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install what a PeachQ stack needs
        # torq.sh needs envsubst and rlwrap (uqs's prerequisite check refuses a
        # start without them); the PeachQ runtime's whole-stack test below
        # starts one.
        if: ${{ !cancelled() && env.PEACHQ_BIN != '' }}
        run: sudo apt-get install -y --no-install-recommends gettext-base rlwrap
      - name: Run the Python tests that need a q, on PeachQ (blocking)
        # Without KDB-X, every Python test that starts a q skips in the hooks
        # above. With PeachQ as the q they run, held to
        # python/peachq_known_gaps.txt both ways (conftest.py), as the
        # q suite is to its own list: a failure not listed fails the build, and
        # so does a listed test that passes. UQF_PEACHQ_STACK_TEST also starts
        # a PeachQ stack from a copy of the tree (test_peachq_pipelines.py).
        if: ${{ !cancelled() && env.PEACHQ_BIN != '' }}
        timeout-minutes: 10
        env:
          UQF_PEACHQ_STACK_TEST: "1"
        # Every configured testpath (pyproject.toml), not just python/: the gates'
        # own tests (scripts/gates/tests) ran only in the python-tests hook,
        # which this job replaces in CI. -n auto: in parallel (pytest-xdist);
        # --dist loadgroup keeps the tests marked xdist_group (the whole-stack
        # ones) on one worker.
        #
        # tests/qrun/ is a testpath too: the docs' marked q blocks run here,
        # their `peachq` half (#1808). --require-q peachq fails a test that cannot have
        # PeachQ rather than skipping it; the KDB-X half skips, visibly.
        # -m "not q_suite": the whole qUnit suite on PeachQ is the "PeachQ q
        # tests" job's, which runs it once rather than in a shard here.
        run: QCMD="$PEACHQ_BIN" uv run pytest -q -n auto --dist loadgroup --require-q peachq -m "not q_suite" --shard "${{ matrix.shard }}/${{ strategy.job-total }}" --store-shard-durations "$RUNNER_TEMP/durations-${{ matrix.shard }}.json"
      - name: Keep this shard's module durations
        # What scripts/dev/test_module_durations.json is refreshed from: CI's
        # own times, which differ from a laptop's (#1696). Merge the shards' with
        # scripts/dev/pytest_shards.py --merge.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: durations-${{ matrix.shard }}
          path: ${{ runner.temp }}/durations-${{ matrix.shard }}.json
          retention-days: 30


  doc-links:
    name: Docs links
    # Its own job (#1689): rendering docs/ is the slowest gate the hooks job
    # had, and nothing else there needs Quarto. Standard library only, so no
    # uv sync. Only when the change can alter the render or a link, or in
    # full mode (scripts/dev/ci_scope.py): the commit hooks leave it to here.
    needs: scope
    if: ${{ needs.scope.outputs.docs == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Quarto
        # The doc-links hook renders docs/ to resolve every link. Pinned for
        # the same reason qlinter is: a renderer that changes how it resolves
        # a link must not turn this repository red without anyone choosing it.
        #
        # Installed rather than skipped, which is the whole point. The
        # contract-surface gate skips here because a hosted runner cannot
        # have KDB-X, and the cost of that skip is visible in this repository's
        # history - the surface went stale and the doc-reference gate was
        # reading it. Quarto costs one step, so there is no reason to repeat
        # that shape of hole.
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"
      - name: Restore PeachQ built from its pinned commit
        # The render's pre-render step writes the q API pages under
        # docs/reference/q-api/ from the qDoc comments, which needs a q
        # (scripts/generate/q_api_docs.py). Same pin and cache as peachq-q.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uqf/peachq
          key: peachq-${{ hashFiles('scripts/peachq.json') }}-${{ runner.os }}-${{ runner.arch }}
      - name: Provide PeachQ for the q API pages
        # Builds the pinned commit on a cold cache (about 40s). Through QCMD
        # only, as everywhere else: nothing is put on PATH.
        shell: bash
        run: |
          set -euo pipefail
          bin="$(python3 scripts/peachq.py)"
          echo "QCMD=$bin" >> "$GITHUB_ENV"
      - name: Check every link and anchor in docs/ resolves
        # WITHOUT --allow-missing, which the pre-commit hook passes. The
        # hook's flag exists so a q developer without Quarto is not blocked;
        # on CI a missing Quarto must be a hard error rather than a gate that
        # quietly checked nothing - the failure mode this repository already
        # has on the contract surface.
        run: python3 scripts/gates/check_doc_links.py

  # The one name branch protection requires: green only when every job in
  # this workflow passed, or was skipped because Scope said its change could
  # not affect it. Kept as its own job so splitting or adding jobs never
  # changes the required check's name. A failed Scope leaves every NEEDED
  # empty, and a job skipped although Scope said "true" (an `if:` that reads
  # the wrong output, a needs that failed) is no pass either: either fails it.
  repository-checks:
    name: Repository checks
    if: ${{ always() }}
    needs: [author, scope, checks, doc-links, peachq-q, peachq-python, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every job passed, or was not needed
        env:
          AUTHOR: ${{ needs.author.result }}
          SCOPE: ${{ needs.scope.result }}
          CHECKS: ${{ needs.checks.result }}
          PYTHON: ${{ needs.peachq-python.result }}
          PYTHON_NEEDED: ${{ needs.scope.outputs.python }}
          WEB: ${{ needs.web.result }}
          WEB_NEEDED: ${{ needs.scope.outputs.frontend }}
          DOCS: ${{ needs.doc-links.result }}
          DOCS_NEEDED: ${{ needs.scope.outputs.docs }}
          Q: ${{ needs.peachq-q.result }}
          Q_NEEDED: ${{ needs.scope.outputs.q }}
        run: |
          fail=0
          need() { echo "$1: $2"; [ "$2" = success ] || { echo "::error::$1 did not succeed ($2)"; fail=1; }; }
          # Skipped counts as passed only when Scope ran and said "false" for it.
          filtered() {
            if [ "$2" = skipped ] && [ "$3" = false ]; then echo "$1: skipped - nothing it checks changed"
            else need "$1" "$2"; fi
          }
          need "Pull request author" "$AUTHOR"
          need "Scope" "$SCOPE"
          need "Hooks and static gates" "$CHECKS"
          filtered "Docs links" "$DOCS" "$DOCS_NEEDED"
          filtered "PeachQ q tests" "$Q" "$Q_NEEDED"
          filtered "Browser application" "$WEB" "$WEB_NEEDED"
          filtered "PeachQ Python tests" "$PYTHON" "$PYTHON_NEEDED"
          exit "$fail"

  web:
    name: Browser application
    # Only when the change touches web/ or the shared CI configuration, or in
    # full mode (scripts/dev/ci_scope.py): the package reads nothing outside
    # web/.
    needs: scope
    if: ${{ needs.scope.outputs.frontend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
