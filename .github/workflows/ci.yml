name: CI

on:
  push:
    branches: [master]
  pull_request:
  # release.yml runs these same checks before it builds an artifact (#872)
  workflow_call:

permissions:
  contents: read
  issues: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # uv run inside the hooks must use the committed resolution.
      UV_LOCKED: "true"
      # These govern local commits/branch names, not a detached PR merge ref.
      # q-docs-peachq would build PeachQ inside the hooks, before its cache is
      # restored; "Run the marked q blocks in docs/ on PeachQ" below covers it.
      SKIP: no-commit-to-branch,branch-naming-with-git-username,q-docs-peachq
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.14"
          python-version: "3.14"
          enable-cache: true
      - name: Install workspace dependencies
        run: uv sync --locked
      - name: Install Quarto
        # The doc-links hook renders docs/ to resolve every link. Pinned for
        # the same reason qlinter is: a renderer that changes how it resolves
        # a link must not turn this repository red without anyone choosing it.
        #
        # Installed rather than skipped, which is the whole point. The
        # contract-surface gate skips here because a hosted runner cannot
        # have KDB-X, and the cost of that skip is visible in this repository's
        # history - the surface went stale and the doc-reference gate was
        # reading it. Quarto costs one step, so there is no reason to repeat
        # that shape of hole.
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"
      - name: Install qlinter
        shell: bash
        # The q-traps hook delegates most of its rules to the
        # standalone linter, and refuses rather than passing vacuously when
        # it is missing. Pinned: the linter releases on its own cadence, and
        # a new rule landing upstream must not turn this repository red
        # without anyone choosing it. The pin lives in .qlinter-version, the
        # one place it is written; the hook refuses any other version.
        run: |
          set -euo pipefail
          read -r QLINT_VERSION < .qlinter-version
          url="https://github.com/kwojdalski/q-lint/releases/download/${QLINT_VERSION}/qlinter-${QLINT_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL "$url" -o /tmp/qlinter.tar.gz
          tar xzf /tmp/qlinter.tar.gz -C /tmp
          install -m755 "/tmp/qlinter-${QLINT_VERSION}-x86_64-unknown-linux-gnu/qlinter" /usr/local/bin/qlinter
          qlinter --rules > /dev/null && echo "qlinter ${QLINT_VERSION} installed"
      - name: Report q runtime coverage
        shell: bash
        run: |
          # The same rule scripts/test.py applies, so CI skips exactly when
          # the hook would have nothing to run: $QCMD, else q on PATH.
          if command -v "${QCMD:-q}" >/dev/null; then
            echo "A q interpreter is available; the q-tests and q-coverage hooks will run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SKIP=$SKIP,q-tests,q-coverage,contract-surface,q-facts" >> "$GITHUB_ENV"
            echo "::warning::No q interpreter on this runner. The full qUnit suite, the coverage gate and q-dependent Python IPC tests are not exercised here; static q checks still run, and the portable qUnit suites run on PeachQ further down."
            echo "### Runtime coverage limitation" >> "$GITHUB_STEP_SUMMARY"
            echo "No q interpreter is installed on this hosted runner. The qUnit, coverage and contract-surface hooks are skipped, and Python tests requiring q skip through their existing fixtures. Static q checks and the remaining Python tests run. Run q tests/run_tests.q and scripts/test.py q-coverage locally with KDB-X before merging q changes." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run repository hooks
        run: uv tool run --from pre-commit==4.6.2 pre-commit run --all-files --show-diff-on-failure
      - name: Check every link and anchor in docs/ resolves
        # Run again here, WITHOUT --allow-missing, which the pre-commit hook
        # passes. The hook's flag exists so a q developer without Quarto is
        # not blocked; on CI a missing Quarto must be a hard error rather
        # than a gate that quietly checked nothing - the failure mode this
        # repository already has on the contract surface.
        if: ${{ !cancelled() }}
        run: uv run python scripts/gates/check_doc_links.py
      - name: Check the generated operational docs match the registry
        # Operational docs are generated, committed and checked.
        # Where the source and the document disagree the source is right by
        # definition, so this fails the build rather than reconciling.
        if: ${{ !cancelled() }}
        # `uv run`, not bare python3: this script imports uqs,
        # which imports loguru. Under the runner's system python3 it died with
        # ModuleNotFoundError before checking anything - so the gate had never
        # once run, and master was red for it. Loud rather than silent, but
        # still a gate that protected nothing. The other three gates here are
        # stdlib-only and do not need the workspace.
        run: uv run python scripts/generate/generate_operational_docs.py --check
      - name: Check the committed contract surface is current
        # WP2 (#139): docs/reference/surfaces/current/ is this tree's
        # half of the contract lock. A committed baseline nothing verifies
        # goes stale silently - the .qetl.coverage.require_schema shape, where a file's
        # existence reads as protection it is not providing. Reports the
        # CONTRACT difference ("is_covered gained an argument"), not a JSON
        # line diff, because only the former is actionable.
        #
        # Skipped without KDB-X: the exporter loads the full q tree, and a
        # partial load would export a quietly incomplete surface. The skip is
        # a WARNING and a summary line, not a notice: on a hosted runner it
        # is every run, and the contract-surface pre-commit hook is then the
        # only thing verifying the surface.
        #
        # The same interpreter rule as contract_surface.py itself ($QCMD,
        # else q on PATH - TorQ's rule).
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if command -v "${QCMD:-q}" >/dev/null; then
            uv run python scripts/generate/contract_surface.py check
          else
            echo "::warning::No KDB-X on this runner; the contract surface in docs/reference/surfaces/current/ was NOT checked. Run 'uv run python scripts/generate/contract_surface.py check' locally before merging."
            echo "The contract surface (docs/reference/surfaces/current/) was not checked: no KDB-X on this runner. The contract-surface pre-commit hook checks it locally." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check the ETL core does not depend on its declarations
        # The split makes core/ framework and sources//workers/ declarations; that
        # is the property that buys - a new source needs no core change.
        # The rule was a convention with no gate, so a
        # file reaching the wrong way would break it with every test green.
        if: ${{ !cancelled() }}
        run: python3 scripts/gates/check_etl_layering.py --check
      - name: Check the q library's module graph is acyclic and reviewed
        # Every edge between library namespaces is listed in the gate (#626):
        # a new one, a stale one or a cycle fails, so a cross-module
        # dependency is a reviewed line rather than an invisible one.
        if: ${{ !cancelled() }}
        run: python3 scripts/gates/check_module_deps.py
      - name: Check q modules stay under their line budget
        # The q counterpart of test_module_split.py (#970): a file over the
        # limit splits, or is listed with a reason and a cap that only shrinks.
        if: ${{ !cancelled() }}
        run: python3 scripts/gates/check_q_module_size.py
      - name: Check every q registry stores its values enlisted
        # A dict of same-keyed dicts collapses into a table on its first
        # insert, and the next differently-shaped entry is refused (#1028).
        # The enlist idiom was prose in three files; this holds it (#1030).
        if: ${{ !cancelled() }}
        run: python3 scripts/gates/check_registry_enlist.py
      - name: Check the rendered diagrams match their d2 sources
        # An .svg committed beside its .d2 is a derived artefact, and this
        # tree knows what happens to those without a gate - docs/man.q once
        # called itself generated while covering 78 of 348 functions. Skips with a
        # notice when d2 is absent or is a different version, since the
        # bytes are only comparable for one renderer (see the script).
        if: ${{ !cancelled() }}
        run: python3 scripts/generate/render_diagrams.py --check
      - name: Check the docs cite functions that exist
        # The generated documentation had gates; the PROSE had none, so a
        # guide could name a function that never existed and every check
        # passed. Its first run found two: a design note citing
        # .qmicro.require_sorted_tape (the function is require_tape) and an
        # agent citing .qetl.coerce.coerce (it is coerce_column).
        if: ${{ !cancelled() }}
        run: python3 scripts/gates/check_doc_references.py
      - name: Check the environment reference lists every variable
        # docs/reference/environment.md is the one operator-facing list. It is
        # hand-written because "optional, and here is what unset does" is a
        # judgement, and checked in both directions because a hand-written
        # reference otherwise ends up describing a previous version of the
        # system. One variable (UQF_DRY_RUN) is built mechanically by
        # .qetl.cfg.env_name and appears in no source file, so grep is not a
        # substitute for this page.
        if: ${{ !cancelled() }}
        run: python3 scripts/gates/check_env_reference.py --check
      - name: Check the pipeline declaration reference lists every key
        # docs/reference/pipeline-declarations.md is hand-written, like the
        # environment page, and for the same reason drifts the day a key is
        # added or renamed. Checked in both directions against the key lists
        # in the declaring q files.
        if: ${{ !cancelled() }}
        run: python3 scripts/gates/check_declaration_reference.py
      - name: Restore PeachQ built from its pinned commit
        # PeachQ is an MIT-licensed q, so unlike KDB-X a hosted runner can
        # have one - which makes it the only interpreter CI can run q with.
        #
        # Built from a pinned COMMIT, not downloaded. The v0.88 release asset
        # was rebuilt and re-uploaded under the same tag three times in five
        # days (#578 and after), each turning every run red at the checksum
        # until someone re-pinned to whatever upstream had published - which
        # makes the pin a formality. A commit hash cannot change under us.
        #
        # The pin and the build options are scripts/peachq.json, the same
        # file the local lanes build from (#719): moving either is one edit
        # there, and it changes this key. The cache is the resolver's own
        # (~/.cache/uqf/peachq), so a hit is a warm cache and needs no network.
        id: peachq-cache
        if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uqf/peachq
          key: peachq-${{ hashFiles('scripts/peachq.json') }}-${{ runner.os }}-${{ runner.arch }}
      - name: Provide PeachQ beside the tree
        # scripts/peachq.py reuses the cached build, or fetches the pinned
        # commit, checks it out, verifies the hash, builds it with this
        # platform's options and identifies the result - about 40s, once per
        # pin. It prints an absolute path and puts nothing on PATH: every
        # other step still finds no q, so nothing here can be mistaken for a
        # KDB-X run. It is reached only by the steps below, which name it
        # through QCMD with UQF_Q_IMPL=peachq, and scripts/test.py asks the
        # binary which q it is before any lane.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bin="$(python3 scripts/peachq.py)"
          # A binary that will not even start fails here, by name, rather
          # than as a confusing first lane.
          printf 'exit 0\n' > "$RUNNER_TEMP/peachq-smoke.q"
          "$bin" "$RUNNER_TEMP/peachq-smoke.q" -q
          echo "PEACHQ_BIN=$bin" >> "$GITHUB_ENV"
          echo "PeachQ: built from peachq-org/peachq@$(python3 scripts/peachq.py --commit)" >> "$GITHUB_STEP_SUMMARY"
      - name: Run the marked q blocks in docs/ on PeachQ
        # A block marked `<!-- q-example: ... -->` is a claim that it runs;
        # this holds every one to it. Blocking: a marked block that fails
        # here is either wrong, or correct on KDB-X only - and then it says
        # so with `kdbx-only: REASON` rather than being unmarked.
        if: ${{ !cancelled() && env.PEACHQ_BIN != '' }}
        run: UQF_Q_IMPL=peachq QCMD="$PEACHQ_BIN" python3 scripts/test.py q-docs
      - name: Run the whole qUnit suite on PeachQ, flattened (blocking)
        # The q tests CI can hold a merge to. This runner has no KDB-X, and
        # PeachQ rejects nested contexts, so scripts/portable/full_suite.py
        # flattens a copy of the tree first (#856) and runs every suite on it.
        # The result is held to tests/q/peachq_known_gaps.txt both ways: a
        # failure not listed fails the build, and so does a listed test that
        # now passes - the list only shrinks (#863).
        if: ${{ !cancelled() && env.PEACHQ_BIN != '' }}
        timeout-minutes: 10
        run: UQF_PEACHQ="$PEACHQ_BIN" python3 scripts/test.py q-unit-peachq
      - name: Install what a PeachQ stack needs
        # torq.sh needs envsubst and rlwrap (uqs's prerequisite check refuses a
        # start without them); the PeachQ runtime's whole-stack test below
        # starts one.
        if: ${{ !cancelled() && env.PEACHQ_BIN != '' }}
        run: sudo apt-get install -y --no-install-recommends gettext-base rlwrap
      - name: Run the Python tests that need a q, on PeachQ (blocking)
        # Without KDB-X, every Python test that starts a q skips in the hooks
        # above. With PeachQ as the q they run, held to
        # python/peachq_known_gaps.txt both ways (python/conftest.py), as the
        # q suite is to its own list: a failure not listed fails the build, and
        # so does a listed test that passes. UQF_PEACHQ_STACK_TEST also starts
        # a PeachQ stack from a copy of the tree (test_peachq_pipelines.py).
        if: ${{ !cancelled() && env.PEACHQ_BIN != '' }}
        timeout-minutes: 10
        env:
          UQF_Q_IMPL: peachq
          UQF_PEACHQ_STACK_TEST: "1"
        run: QCMD="$PEACHQ_BIN" UQF_PEACHQ="$PEACHQ_BIN" uv run pytest -q python

  web:
    name: Browser application
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  kdbx-attestation:
    # Advisory (#1014): hosted CI has no KDB-X, so whether the q-tests,
    # q-coverage, contract-surface and q-facts hooks passed on a PR's tree is
    # known only where they ran. scripts/dev/attest_kdbx.py records that as a
    # `KDB-X-gates: <tree>` trailer; this reports whether the head's exact
    # tree carries one. It warns and never fails.
    name: KDB-X attestation (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Report whether the KDB-X gates passed on this tree
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if out=$(python3 scripts/gates/check_kdbx_attestation.py "$BASE" "$HEAD"); then
            echo "$out" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=KDB-X attestation::$out"
            echo "$out" >> "$GITHUB_STEP_SUMMARY"
          fi
