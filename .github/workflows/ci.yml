name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  issues: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # uv run inside the hooks must use the committed resolution.
      UV_LOCKED: "true"
      # These govern local commits/branch names, not a detached PR merge ref.
      SKIP: no-commit-to-branch,branch-naming-with-git-username
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.14"
          python-version: "3.14"
          enable-cache: true
      - name: Install workspace dependencies
        run: uv sync --locked
      - name: Install qlinter
        shell: bash
        # The q-traps hook delegates thirteen of its fifteen rules to the
        # standalone linter, and refuses rather than passing vacuously when
        # it is missing. Pinned: the linter releases on its own cadence, and
        # a new rule landing upstream must not turn this repository red
        # without anyone choosing it - see DELEGATED_CODES.
        env:
          QLINT_VERSION: v0.2.0
        run: |
          set -euo pipefail
          url="https://github.com/kwojdalski/q-lint/releases/download/${QLINT_VERSION}/qlinter-${QLINT_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL "$url" -o /tmp/qlinter.tar.gz
          tar xzf /tmp/qlinter.tar.gz -C /tmp
          install -m755 "/tmp/qlinter-${QLINT_VERSION}-x86_64-unknown-linux-gnu/qlinter" /usr/local/bin/qlinter
          qlinter --rules > /dev/null && echo "qlinter ${QLINT_VERSION} installed"
      - name: Report q runtime coverage
        shell: bash
        run: |
          # The same rule scripts/test.py applies, so CI skips exactly when
          # the hook would have nothing to run: $Q, else ~/.kx/bin/q.
          if [ -x "${Q:-$HOME/.kx/bin/q}" ]; then
            echo "A q interpreter is available; the q-tests and q-coverage hooks will run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SKIP=$SKIP,q-tests,q-coverage,contract-surface" >> "$GITHUB_ENV"
            echo "::warning::No q interpreter on this runner. qUnit, the coverage gate and q-dependent Python IPC tests are not exercised; static q checks still run."
            echo "### Runtime coverage limitation" >> "$GITHUB_STEP_SUMMARY"
            echo "No q interpreter is installed on this hosted runner. The qUnit, coverage and contract-surface hooks are skipped, and Python tests requiring q skip through their existing fixtures. Static q checks and the remaining Python tests run. Run q tests/run_tests.q and scripts/test.py q-coverage locally with KDB-X before merging q changes." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run repository hooks
        run: uv tool run --from pre-commit==4.6.2 pre-commit run --all-files --show-diff-on-failure
      - name: Check the generated operational docs match the registry
        # Operational docs are generated, committed and checked.
        # Where the source and the document disagree the source is right by
        # definition, so this fails the build rather than reconciling.
        if: ${{ !cancelled() }}
        # `uv run`, not bare python3: this script imports uqs,
        # which imports loguru. Under the runner's system python3 it died with
        # ModuleNotFoundError before checking anything - so the gate had never
        # once run, and master was red for it. Loud rather than silent, but
        # still a gate that protected nothing. The other three gates here are
        # stdlib-only and do not need the workspace.
        run: uv run python scripts/generate/generate_operational_docs.py --check
      - name: Check the committed contract surface is current
        # WP2 (#139): docs/reference/surfaces/current/ is this tree's
        # half of the contract lock. A committed baseline nothing verifies
        # goes stale silently - the .qmatz.require_schema shape, where a file's
        # existence reads as protection it is not providing. Reports the
        # CONTRACT difference ("is_covered gained an argument"), not a JSON
        # line diff, because only the former is actionable.
        #
        # Skipped without KDB-X: the exporter loads the full q tree, and a
        # partial load would export a quietly incomplete surface. The skip is
        # a WARNING and a summary line, not a notice: on a hosted runner it
        # is every run, and the contract-surface pre-commit hook is then the
        # only thing verifying the surface.
        #
        # The same interpreter rule as contract_surface.py itself ($UQFQ,
        # else ~/.kx/bin/q). A bare `q` on PATH used to count here too, and
        # the script would then have refused it anyway.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ -x "${UQFQ:-$HOME/.kx/bin/q}" ]; then
            uv run python scripts/generate/contract_surface.py check
          else
            echo "::warning::No KDB-X on this runner; the contract surface in docs/reference/surfaces/current/ was NOT checked. Run 'uv run python scripts/generate/contract_surface.py check' locally before merging."
            echo "The contract surface (docs/reference/surfaces/current/) was not checked: no KDB-X on this runner. The contract-surface pre-commit hook checks it locally." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check docs/man.q matches the source qDoc comments
        # WP8 (#146): the plan says keep source documentation authoritative
        # and REGENERATE derived docs. man.q calls itself generated on line 1
        # but had no generator, so it had fallen from covering the library to
        # covering 78 of 348 public functions - and nobody noticed, because
        # until recently it did not load at all.
        if: ${{ !cancelled() }}
        run: python3 scripts/generate/generate_man_registry.py --check
      - name: Check the ETL core does not depend on its declarations
        # The split makes core/ framework and sources//workers/ declarations; that
        # is the property that buys - a new source needs no core change.
        # The rule was a convention with no gate, so a
        # file reaching the wrong way would break it with every test green.
        if: ${{ !cancelled() }}
        run: python3 scripts/gates/check_etl_layering.py --check
      - name: Check the rendered diagrams match their d2 sources
        # An .svg committed beside its .d2 is a derived artefact, and this
        # tree knows what happens to those without a gate - man.q called
        # itself generated while covering 78 of 348 functions. Skips with a
        # notice when d2 is absent or is a different version, since the
        # bytes are only comparable for one renderer (see the script).
        if: ${{ !cancelled() }}
        run: python3 scripts/generate/render_diagrams.py --check
      - name: Check the docs cite functions that exist
        # The generated documentation had gates; the PROSE had none, so a
        # guide could name a function that never existed and every check
        # passed. Its first run found two: a design note citing
        # .qmicro.require_sorted_tape (the function is require_tape) and an
        # agent citing .qcoer.coerce (it is coerce_column).
        if: ${{ !cancelled() }}
        run: python3 scripts/gates/check_doc_references.py
      - name: Check the environment reference lists every variable
        # docs/reference/environment.md is the one operator-facing list. It is
        # hand-written because "optional, and here is what unset does" is a
        # judgement, and checked in both directions because a hand-written
        # reference otherwise ends up describing a previous version of the
        # system. One variable (UQF_DRY_RUN) is built mechanically by
        # .qwcfg.env_name and appears in no source file, so grep is not a
        # substitute for this page.
        if: ${{ !cancelled() }}
        run: python3 scripts/gates/check_env_reference.py --check
      - name: Check no bare E-/F- requirement citation has crept back in
        # Requirements are ETL-nn / FE-nn since #109; a bare E-nn in source
        # is now the question bank's id, and must be marked as such. The
        # very first run after the rename caught four in a file written the
        # same day - by the author of the rename.
        if: ${{ !cancelled() }}
        run: python3 scripts/dev/renumber_requirement_ids.py --check

  web:
    name: Browser application
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
